name: OpenClaw Live And E2E Checks (Reusable)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-127853-focused-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-proof:
    name: PR 127853 exact-head focused Gateway proof
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          repository: zhangguiping-xydt/openclaw
          ref: 5f8c56adb4aec2f8aa75c836e3578dedb90c8e54
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "5f8c56adb4aec2f8aa75c836e3578dedb90c8e54"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true

      - name: Run focused Gateway proof
        env:
          CI: "true"
          OPENCLAW_BUILD_PRIVATE_QA: "1"
          OPENCLAW_E2E_WORKERS: "1"
        run: node scripts/run-vitest.mjs test/e2e/qa-lab/runtime/gateway-runtime-only-inbound-context.e2e.test.ts
