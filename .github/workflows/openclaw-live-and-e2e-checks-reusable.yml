name: OpenClaw Live And E2E Checks (Reusable)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-127853-focused-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-proof:
    name: PR 127853 source-runtime prewarm proof
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          repository: zhangguiping-xydt/openclaw
          ref: 56e616884e16396417b4eaadf322caf2691e34f1
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "56e616884e16396417b4eaadf322caf2691e34f1"

      - name: Prewarm source plugin runtime before the test clock
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const file = "test/e2e/qa-lab/runtime/gateway-runtime-only-inbound-context.e2e.test.ts";
          let source = fs.readFileSync(file, "utf8");
          const importAnchor = 'import { afterEach, beforeEach, describe, expect, it } from "vitest";';
          const importReplacement = `${importAnchor}\nimport { createPluginModuleLoader } from "../../../../src/plugins/loader-module-runtime.js";`;
          const bodyAnchor = 'const PROOF_CHANNEL_ID = "runtime-only-inbound-proof";';
          const bodyReplacement = [
            'process.stdout.write("pr127853-plugin-runtime-prewarm-start\\n");',
            'createPluginModuleLoader({ devSourceRoot: process.cwd() })(',
            '  path.join(process.cwd(), "src/plugins/runtime/index.ts"),',
            ');',
            'process.stdout.write("pr127853-plugin-runtime-prewarm-complete\\n");',
            '',
            bodyAnchor,
          ].join("\n");
          for (const [anchor, replacement] of [
            [importAnchor, importReplacement],
            [bodyAnchor, bodyReplacement],
          ]) {
            const parts = source.split(anchor);
            if (parts.length !== 2) {
              throw new Error(`unexpected prewarm anchor count: ${parts.length - 1}`);
            }
            source = `${parts[0]}${replacement}${parts[1]}`;
          }
          fs.writeFileSync(file, source);
          NODE
          git diff --check
          git diff -- test/e2e/qa-lab/runtime/gateway-runtime-only-inbound-context.e2e.test.ts

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true

      - name: Restore PR 127853 E2E dist
        id: pr127853-dist-cache
        uses: actions/cache/restore@v4
        with:
          path: dist
          key: pr127853-e2e-dist-56e616884e1-node24-privateqa-v1

      - name: Run source-runtime prewarmed Gateway proof
        env:
          CI: "true"
          OPENCLAW_BUILD_PRIVATE_QA: "1"
          OPENCLAW_E2E_SKIP_BUILD: ${{ steps.pr127853-dist-cache.outputs.cache-hit == 'true' && '1' || '0' }}
          OPENCLAW_E2E_WORKERS: "1"
          OPENCLAW_GATEWAY_STARTUP_TRACE: "1"
          OPENCLAW_VITEST_FS_MODULE_CACHE_PATH: ${{ runner.temp }}/pr127853-vitest-cache
        run: |
          test "$(git status --short)" = " M test/e2e/qa-lab/runtime/gateway-runtime-only-inbound-context.e2e.test.ts"
          mkdir -p "$OPENCLAW_VITEST_FS_MODULE_CACHE_PATH"
          timeout --signal=TERM --kill-after=30s 15m node scripts/run-vitest.mjs test/e2e/qa-lab/runtime/gateway-runtime-only-inbound-context.e2e.test.ts

      - name: Save PR 127853 E2E dist
        if: always() && steps.pr127853-dist-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist
          key: pr127853-e2e-dist-56e616884e1-node24-privateqa-v1
