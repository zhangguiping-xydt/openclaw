name: OpenClaw Live And E2E Checks (Reusable)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-127853-focused-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-proof:
    name: PR 127853 exact-head warmed Jiti proof
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          repository: zhangguiping-xydt/openclaw
          ref: 5f8c56adb4aec2f8aa75c836e3578dedb90c8e54
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "5f8c56adb4aec2f8aa75c836e3578dedb90c8e54"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true

      - name: Restore PR 127853 E2E dist
        id: pr127853-dist-cache
        uses: actions/cache/restore@v4
        with:
          path: dist
          key: pr127853-e2e-dist-5f8c56adb4a-node24-privateqa-v1

      - name: Run exact-head warmed Jiti Gateway proof
        env:
          CI: "true"
          OPENCLAW_BUILD_PRIVATE_QA: "1"
          OPENCLAW_E2E_SKIP_BUILD: ${{ steps.pr127853-dist-cache.outputs.cache-hit == 'true' && '1' || '0' }}
          OPENCLAW_E2E_WORKERS: "1"
          OPENCLAW_GATEWAY_STARTUP_TRACE: "1"
          OPENCLAW_VITEST_FS_MODULE_CACHE_PATH: ${{ runner.temp }}/pr127853-vitest-cache
          XDG_CACHE_HOME: ${{ runner.temp }}/pr127853-xdg-cache
        run: |
          test -z "$(git status --short)"
          mkdir -p "$OPENCLAW_VITEST_FS_MODULE_CACHE_PATH" "$XDG_CACHE_HOME"

          warmup_status=0
          timeout --signal=TERM --kill-after=30s 15m node scripts/run-vitest.mjs test/e2e/qa-lab/runtime/gateway-runtime-only-inbound-context.e2e.test.ts || warmup_status=$?
          printf 'Cold Jiti-cache warmup exit status: `%s`\n' "$warmup_status" | tee -a "$GITHUB_STEP_SUMMARY"
          du -sh "$XDG_CACHE_HOME/openclaw/jiti" || true

          proof_status=0
          timeout --signal=TERM --kill-after=30s 15m node scripts/run-vitest.mjs test/e2e/qa-lab/runtime/gateway-runtime-only-inbound-context.e2e.test.ts || proof_status=$?
          printf 'Warmed Jiti-cache exact-head proof exit status: `%s`\n' "$proof_status" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$proof_status"

      - name: Save PR 127853 E2E dist
        if: always() && steps.pr127853-dist-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist
          key: pr127853-e2e-dist-5f8c56adb4a-node24-privateqa-v1
