name: OpenClaw Live And E2E Checks (Reusable)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-127853-focused-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-proof:
    name: PR 127853 exact-head focused Gateway proof diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          repository: zhangguiping-xydt/openclaw
          ref: 5f8c56adb4aec2f8aa75c836e3578dedb90c8e54
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "5f8c56adb4aec2f8aa75c836e3578dedb90c8e54"

      - name: Apply proof-only diagnostics
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const file = "test/e2e/qa-lab/runtime/gateway-runtime-only-inbound-context.e2e.test.ts";
          let source = fs.readFileSync(file, "utf8");
          function replaceOnce(from, to) {
            const parts = source.split(from);
            if (parts.length !== 2) {
              throw new Error(`diagnostic anchor count ${parts.length - 1}: ${from.slice(0, 80)}`);
            }
            source = `${parts[0]}${to}${parts[1]}`;
          }
          const marker = (name) => `process.stdout.write("pr127853-diagnostic ${name}\\n");`;
          replaceOnce("{ timeout: 90_000 }", "{ timeout: 300_000 }");
          replaceOnce(
            "        const providerAddress = providerServer.address();",
            `        ${marker("provider-listening")}\n        const providerAddress = providerServer.address();`,
          );
          replaceOnce(
            "        const runtimeConfig = getRuntimeConfigSnapshot();",
            `        ${marker("gateway-started")}\n        const runtimeConfig = getRuntimeConfigSnapshot();`,
          );
          replaceOnce(
            "        await expect\n          .poll(() => typeof getProofDispatch(dispatchKey), { timeout: 10_000, interval: 50 })",
            `        ${marker("dispatcher-wait")}\n        await expect\n          .poll(() => typeof getProofDispatch(dispatchKey), { timeout: 10_000, interval: 50 })`,
          );
          replaceOnce(
            "          .toBe(\"function\");\n        const dispatch = getProofDispatch(dispatchKey);",
            `          .toBe("function");\n        ${marker("dispatcher-ready")}\n        const dispatch = getProofDispatch(dispatchKey);`,
          );
          replaceOnce(
            "        await dispatch({\n          body: \"\",",
            `        ${marker("runtime-dispatch-start")}\n        await dispatch({\n          body: "",`,
          );
          replaceOnce(
            "        });\n        expect(providerRequests).toHaveLength(1);",
            `        });\n        ${marker("runtime-dispatch-complete")}\n        expect(providerRequests).toHaveLength(1);`,
          );
          replaceOnce(
            "        await dispatch({\n          body: visibleUserMessage,",
            `        ${marker("visible-dispatch-start")}\n        await dispatch({\n          body: visibleUserMessage,`,
          );
          replaceOnce(
            "        });\n        expect(providerRequests).toHaveLength(2);",
            `        });\n        ${marker("visible-dispatch-complete")}\n        expect(providerRequests).toHaveLength(2);`,
          );
          replaceOnce(
            "        const transcriptText = JSON.stringify(await readSessionTranscript(sessionKey));",
            `        ${marker("transcript-ready")}\n        const transcriptText = JSON.stringify(await readSessionTranscript(sessionKey));`,
          );
          replaceOnce(
            "      } finally {\n        if (gateway) {",
            `      } finally {\n        ${marker("cleanup-start")}\n        if (gateway) {`,
          );
          fs.writeFileSync(file, source);
          NODE
          git diff --check
          git diff -- test/e2e/qa-lab/runtime/gateway-runtime-only-inbound-context.e2e.test.ts

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true

      - name: Run focused Gateway proof diagnostic
        env:
          CI: "true"
          OPENCLAW_BUILD_PRIVATE_QA: "1"
          OPENCLAW_E2E_WORKERS: "1"
        run: node scripts/run-vitest.mjs test/e2e/qa-lab/runtime/gateway-runtime-only-inbound-context.e2e.test.ts
