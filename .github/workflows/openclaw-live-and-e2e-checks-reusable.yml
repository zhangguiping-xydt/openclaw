name: OpenClaw Live And E2E Checks (Reusable)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-127853-focused-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-proof:
    name: PR 127853 exact-head startup timeline
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          repository: zhangguiping-xydt/openclaw
          ref: 5f8c56adb4aec2f8aa75c836e3578dedb90c8e54
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "5f8c56adb4aec2f8aa75c836e3578dedb90c8e54"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true

      - name: Restore PR 127853 E2E dist
        id: pr127853-dist-cache
        uses: actions/cache/restore@v4
        with:
          path: dist
          key: pr127853-e2e-dist-5f8c56adb4a-node24-privateqa-v1

      - name: Run exact-head Gateway startup diagnostic
        env:
          CI: "true"
          OPENCLAW_BUILD_PRIVATE_QA: "1"
          OPENCLAW_E2E_SKIP_BUILD: ${{ steps.pr127853-dist-cache.outputs.cache-hit == 'true' && '1' || '0' }}
          OPENCLAW_E2E_WORKERS: "1"
          OPENCLAW_GATEWAY_STARTUP_TRACE: "1"
          OPENCLAW_DIAGNOSTICS: timeline
          OPENCLAW_DIAGNOSTICS_TIMELINE_PATH: ${{ runner.temp }}/pr127853-timeline.jsonl
        run: |
          test -z "$(git status --short)"
          status=0
          timeout --signal=TERM --kill-after=30s 15m node scripts/run-vitest.mjs test/e2e/qa-lab/runtime/gateway-runtime-only-inbound-context.e2e.test.ts || status=$?
          printf 'Exact-head diagnostic exit status: `%s`\n' "$status" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ -f "$OPENCLAW_DIAGNOSTICS_TIMELINE_PATH" ]]; then
            node - "$OPENCLAW_DIAGNOSTICS_TIMELINE_PATH" <<'NODE'
          const fs = require("node:fs");
          const events = fs
            .readFileSync(process.argv[2], "utf8")
            .trim()
            .split("\n")
            .filter(Boolean)
            .map((line) => JSON.parse(line));
          const startup = events.filter((event) => event.phase === "startup");
          const completed = new Set(
            startup
              .filter((event) => event.type === "span.end" || event.type === "span.error")
              .map((event) => event.spanId),
          );
          const unfinished = startup.filter(
            (event) => event.type === "span.start" && !completed.has(event.spanId),
          );
          process.stdout.write(`pr127853-startup-timeline ${JSON.stringify({
            eventCount: startup.length,
            unfinished: unfinished.map(({ name, spanId, timestamp, attributes }) => ({
              name,
              spanId,
              timestamp,
              attributes,
            })),
            lastEvents: startup.slice(-12).map(({ type, name, spanId, timestamp }) => ({
              type,
              name,
              spanId,
              timestamp,
            })),
          })}\n`);
          NODE
          else
            echo 'pr127853-startup-timeline missing'
          fi
          exit "$status"

      - name: Save PR 127853 E2E dist
        if: always() && steps.pr127853-dist-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist
          key: pr127853-e2e-dist-5f8c56adb4a-node24-privateqa-v1
