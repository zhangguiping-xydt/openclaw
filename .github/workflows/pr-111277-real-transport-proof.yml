name: PR 111277 real transport proof

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact PR head SHA to prove
        required: true
        type: string

permissions:
  contents: read

env:
  CI: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.x"
  TARGET_SHA: ${{ inputs.target_sha }}

jobs:
  real-transport-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: zhangguiping-xydt/openclaw
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact target
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$TARGET_SHA"
          echo "EXACT_HEAD=$actual_sha"
          echo "RUNNER_NETWORK=secretless GitHub-hosted loopback only"

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
          install-deps: "true"
          frozen-lockfile: "true"
          use-actions-cache: "false"

      - name: Run real HTTP transport lifecycle proof
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { createServer } from "node:http";

          const { fetchWithSsrFGuard } = await import("./src/infra/net/fetch-guard.ts");
          const observations = new Map();
          const liveResponses = new Set();

          const server = createServer((request, response) => {
            const pathname = new URL(request.url ?? "/", "http://127.0.0.1").pathname;
            let resolveClosed;
            const closed = new Promise((resolve) => {
              resolveClosed = resolve;
            });
            const observation = {
              pathname,
              requests: 1,
              responseClosed: false,
              requestAborted: false,
              socketClosed: false,
              closed,
            };
            observations.set(pathname, observation);
            liveResponses.add(response);

            request.on("aborted", () => {
              observation.requestAborted = true;
            });
            request.socket.on("close", () => {
              observation.socketClosed = true;
            });
            response.on("close", () => {
              observation.responseClosed = true;
              liveResponses.delete(response);
              resolveClosed();
            });

            if (pathname === "/redirect-missing") {
              response.writeHead(302, {
                "content-type": "text/plain",
                connection: "keep-alive",
              });
              response.write("redirect-body-still-streaming\n");
              return;
            }

            response.writeHead(200, {
              "content-type": "text/plain",
              connection: "keep-alive",
            });
            response.write(
              pathname === "/reader-owned"
                ? "reader-owned-first-chunk\n"
                : "final-unread-first-chunk\n",
            );
          });

          function elapsedMs(startedAt) {
            return Math.round((performance.now() - startedAt) * 10) / 10;
          }

          async function within(promise, timeoutMs, label) {
            let timer;
            try {
              return await Promise.race([
                promise,
                new Promise((_, reject) => {
                  timer = setTimeout(
                    () => reject(new Error(label + " exceeded " + timeoutMs + "ms")),
                    timeoutMs,
                  );
                }),
              ]);
            } finally {
              clearTimeout(timer);
            }
          }

          function observed(pathname) {
            const observation = observations.get(pathname);
            assert.ok(observation, "loopback server did not observe " + pathname);
            assert.equal(observation.requests, 1);
            return observation;
          }

          await new Promise((resolve, reject) => {
            server.once("error", reject);
            server.listen(0, "127.0.0.1", resolve);
          });

          const address = server.address();
          assert.ok(address && typeof address === "object");
          const origin = "http://127.0.0.1:" + address.port;
          const options = (pathname) => ({
            url: origin + pathname,
            policy: { allowPrivateNetwork: true },
            timeoutMs: 10_000,
          });

          console.log(
            "PROOF_ENV exactHead=" +
              process.env.TARGET_SHA +
              " node=" +
              process.versions.node +
              " transport=real-undici-pinned-http-loopback",
          );

          try {
            const finalResult = await within(
              fetchWithSsrFGuard(options("/final-unread")),
              5_000,
              "final response fetch",
            );
            assert.equal(finalResult.response.status, 200);
            const finalObservation = observed("/final-unread");
            const finalStartedAt = performance.now();
            await within(finalResult.release(), 5_000, "final unread release");
            await within(finalObservation.closed, 5_000, "final unread server close");
            assert.equal(finalObservation.responseClosed, true);
            assert.equal(finalResult.response.bodyUsed, true);
            console.log(
              "PROOF_CASE final-unread PASS releaseMs=" +
                elapsedMs(finalStartedAt) +
                " status=200 responseBodyUsed=" +
                finalResult.response.bodyUsed +
                " serverResponseClosed=" +
                finalObservation.responseClosed +
                " socketClosed=" +
                finalObservation.socketClosed,
            );

            const redirectStartedAt = performance.now();
            let redirectError;
            try {
              await within(
                fetchWithSsrFGuard(options("/redirect-missing")),
                5_000,
                "redirect failure cleanup",
              );
              assert.fail("missing-location redirect unexpectedly succeeded");
            } catch (error) {
              redirectError = error;
            }
            assert.match(String(redirectError), /missing location header/i);
            const redirectObservation = observed("/redirect-missing");
            await within(redirectObservation.closed, 5_000, "redirect server close");
            assert.equal(redirectObservation.responseClosed, true);
            console.log(
              "PROOF_CASE redirect-error PASS cleanupMs=" +
                elapsedMs(redirectStartedAt) +
                " error=missing-location serverResponseClosed=" +
                redirectObservation.responseClosed +
                " socketClosed=" +
                redirectObservation.socketClosed,
            );

            const readerResult = await within(
              fetchWithSsrFGuard(options("/reader-owned")),
              5_000,
              "reader-owned fetch",
            );
            const reader = readerResult.response.body?.getReader();
            assert.ok(reader, "reader-owned response had no body");
            const firstRead = await within(reader.read(), 5_000, "reader first chunk");
            assert.equal(firstRead.done, false);
            assert.match(new TextDecoder().decode(firstRead.value), /reader-owned-first-chunk/);
            const readerObservation = observed("/reader-owned");
            const readerStartedAt = performance.now();
            await within(reader.cancel("proof reader owner cleanup"), 5_000, "reader cancel");
            reader.releaseLock();
            assert.equal(readerResult.response.body?.locked, false);
            await within(readerResult.release(), 5_000, "reader-owned release");
            await within(readerObservation.closed, 5_000, "reader-owned server close");
            assert.equal(readerObservation.responseClosed, true);
            console.log(
              "PROOF_CASE reader-owned PASS cleanupMs=" +
                elapsedMs(readerStartedAt) +
                " readerUnlocked=" +
                !readerResult.response.body?.locked +
                " serverResponseClosed=" +
                readerObservation.responseClosed +
                " socketClosed=" +
                readerObservation.socketClosed,
            );

            console.log(
              "PROOF_SUMMARY PASS cases=3 exactHead=" +
                process.env.TARGET_SHA +
                " realRequests=" +
                observations.size,
            );
          } finally {
            for (const response of liveResponses) {
              response.destroy();
            }
            server.closeAllConnections();
            await new Promise((resolve) => server.close(resolve));
          }
          JS
