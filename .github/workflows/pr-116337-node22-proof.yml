name: PR 116337 exact-head Node 22 proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-116337-node22-proof
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Setup supported Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3

      - name: Clone exact contributor head anonymously
        shell: bash
        env:
          EXPECTED_SHA: 5d6e600b48179ea01168e34d8ad8bb545ec8f3df
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/zhangguiping-xydt/openclaw.git
          git -C source fetch --depth=1 origin fix/problem-g3-openai-media-abort
          git -C source checkout --detach FETCH_HEAD
          actual_sha="$(git -C source rev-parse HEAD)"
          echo "Validation SHA: $actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Install pinned dependencies without inherited credentials
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/pr-116337-node22-proof"
          proof_home="$proof_root/home"
          proof_tmp="$proof_root/tmp"
          cache_home="$proof_root/cache"
          corepack_home="$cache_home/corepack"
          pnpm_home="$proof_root/pnpm-home"
          evidence_dir="$proof_root/evidence"
          mkdir -p "$proof_home" "$proof_tmp" "$cache_home" "$corepack_home" "$pnpm_home" "$evidence_dir"
          safe_path="$pnpm_home:$PATH"
          expected_package_manager="pnpm@12.1.0+sha512.d9b8276d97f6ec86e49815877f91ee9f63cee61f2063b304e43b6dab8fa07ce8a9afd46d2facd39f921e6a9d06b3c75a81349c7b888c2d22886bae0229901037"
          package_manager="$(
            env -i \
              HOME="$proof_home" \
              PATH="$safe_path" \
              CI=1 \
              TMPDIR="$proof_tmp" \
              XDG_CACHE_HOME="$cache_home" \
              node -e 'const p=require("./package.json"); process.stdout.write(p.packageManager || "")'
          )"
          test "$package_manager" = "$expected_package_manager"

          env -i \
            HOME="$proof_home" \
            PATH="$safe_path" \
            CI=1 \
            TMPDIR="$proof_tmp" \
            XDG_CACHE_HOME="$cache_home" \
            COREPACK_HOME="$corepack_home" \
            PNPM_HOME="$pnpm_home" \
            corepack enable --install-directory "$pnpm_home"
          env -i \
            HOME="$proof_home" \
            PATH="$safe_path" \
            CI=1 \
            TMPDIR="$proof_tmp" \
            XDG_CACHE_HOME="$cache_home" \
            COREPACK_HOME="$corepack_home" \
            PNPM_HOME="$pnpm_home" \
            corepack prepare "$package_manager" --activate
          env -i \
            HOME="$proof_home" \
            PATH="$safe_path" \
            CI=1 \
            TMPDIR="$proof_tmp" \
            XDG_CACHE_HOME="$cache_home" \
            COREPACK_HOME="$corepack_home" \
            PNPM_HOME="$pnpm_home" \
            PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false \
            pnpm_config_verify_deps_before_run=false \
            pnpm install --frozen-lockfile --prefer-offline

      - name: Run exact-head Gateway and Worker lifecycle proof
        shell: bash
        working-directory: source
        env:
          EXPECTED_SHA: 5d6e600b48179ea01168e34d8ad8bb545ec8f3df
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/pr-116337-node22-proof"
          proof_home="$proof_root/home"
          proof_tmp="$proof_root/tmp"
          cache_home="$proof_root/cache"
          corepack_home="$cache_home/corepack"
          pnpm_home="$proof_root/pnpm-home"
          evidence_dir="$proof_root/evidence"
          safe_path="$pnpm_home:$PATH"

          {
            echo "exact_head=$EXPECTED_SHA"
            echo "node=$(node --version)"
            echo "runtime=$(node -p 'process.platform + \"/\" + process.arch')"
          } | tee "$evidence_dir/environment.txt"

          env -i \
            HOME="$proof_home" \
            PATH="$safe_path" \
            CI=1 \
            TMPDIR="$proof_tmp" \
            XDG_CACHE_HOME="$cache_home" \
            COREPACK_HOME="$corepack_home" \
            PNPM_HOME="$pnpm_home" \
            NODE_DISABLE_COMPILE_CACHE=1 \
            NO_COLOR=1 \
            node scripts/run-vitest.mjs \
              src/gateway/openai-http.server.media-preprocessing-abort.test.ts \
              src/media/document-extractors.runtime.test.ts \
              --reporter=verbose \
            2>&1 | tee "$evidence_dir/node22-runtime-proof.log"

      - name: Build exact head and verify packaged Worker
        shell: bash
        working-directory: source
        env:
          EXPECTED_SHA: 5d6e600b48179ea01168e34d8ad8bb545ec8f3df
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/pr-116337-node22-proof"
          proof_home="$proof_root/home"
          proof_tmp="$proof_root/tmp"
          cache_home="$proof_root/cache"
          corepack_home="$cache_home/corepack"
          pnpm_home="$proof_root/pnpm-home"
          evidence_dir="$proof_root/evidence"
          safe_path="$pnpm_home:$PATH"

          env -i \
            HOME="$proof_home" \
            PATH="$safe_path" \
            CI=1 \
            TMPDIR="$proof_tmp" \
            XDG_CACHE_HOME="$cache_home" \
            COREPACK_HOME="$corepack_home" \
            PNPM_HOME="$pnpm_home" \
            PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false \
            pnpm_config_verify_deps_before_run=false \
            pnpm build \
            2>&1 | tee "$evidence_dir/node22-build.log"

          test -f dist/media/document-extractors.worker.js
          {
            echo "exact_head=$EXPECTED_SHA"
            echo "packaged_worker=dist/media/document-extractors.worker.js"
            sha256sum dist/media/document-extractors.worker.js
          } | tee "$evidence_dir/packaged-worker.txt"

      - name: Upload redacted proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pr-116337-node22-exact-head-proof
          path: ${{ runner.temp }}/pr-116337-node22-proof/evidence
          if-no-files-found: warn
          retention-days: 14
