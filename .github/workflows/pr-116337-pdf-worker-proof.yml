name: PR 116337 PDF worker proof

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact contributor head to build and prove
        required: true
        default: 59977411fb513777637de4d5070dc5944a1bd655
        type: string

permissions:
  contents: read

concurrency:
  group: pr-116337-pdf-worker-proof
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout trusted proof tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: proof/pr-116337-pdf-worker
          path: proof-tooling
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: Clone exact contributor head anonymously
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_SHA" = "59977411fb513777637de4d5070dc5944a1bd655"
          git init source
          git -C source remote add origin https://github.com/zhangguiping-xydt/openclaw.git
          git -C source fetch --depth=1 origin verify/pr-116337-5f7794e
          git -C source checkout --detach FETCH_HEAD
          actual_sha="$(git -C source rev-parse HEAD)"
          echo "Validation SHA: $actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Install pinned dependencies without inherited credentials
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/pr-116337-pdf-proof"
          proof_home="$proof_root/home"
          proof_tmp="$proof_root/tmp"
          cache_home="$proof_root/cache"
          corepack_home="$cache_home/corepack"
          pnpm_home="$proof_root/pnpm-home"
          mkdir -p "$proof_home" "$proof_tmp" "$cache_home" "$corepack_home" "$pnpm_home"
          safe_path="$pnpm_home:$PATH"
          expected_package_manager="pnpm@12.1.0+sha512.d9b8276d97f6ec86e49815877f91ee9f63cee61f2063b304e43b6dab8fa07ce8a9afd46d2facd39f921e6a9d06b3c75a81349c7b888c2d22886bae0229901037"
          package_manager="$(
            env -i \
              HOME="$proof_home" \
              PATH="$safe_path" \
              CI=1 \
              TMPDIR="$proof_tmp" \
              XDG_CACHE_HOME="$cache_home" \
              node -e 'const p=require("./package.json"); process.stdout.write(p.packageManager || "")'
          )"
          test "$package_manager" = "$expected_package_manager"

          env -i \
            HOME="$proof_home" \
            PATH="$safe_path" \
            CI=1 \
            TMPDIR="$proof_tmp" \
            XDG_CACHE_HOME="$cache_home" \
            COREPACK_HOME="$corepack_home" \
            PNPM_HOME="$pnpm_home" \
            corepack enable --install-directory "$pnpm_home"
          env -i \
            HOME="$proof_home" \
            PATH="$safe_path" \
            CI=1 \
            TMPDIR="$proof_tmp" \
            XDG_CACHE_HOME="$cache_home" \
            COREPACK_HOME="$corepack_home" \
            PNPM_HOME="$pnpm_home" \
            corepack prepare "$package_manager" --activate
          env -i \
            HOME="$proof_home" \
            PATH="$safe_path" \
            CI=1 \
            TMPDIR="$proof_tmp" \
            XDG_CACHE_HOME="$cache_home" \
            COREPACK_HOME="$corepack_home" \
            PNPM_HOME="$pnpm_home" \
            PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false \
            pnpm_config_verify_deps_before_run=false \
            pnpm install --frozen-lockfile --prefer-offline

      - name: Build the exact head in the sanitized environment
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/pr-116337-pdf-proof"
          proof_home="$proof_root/home"
          proof_tmp="$proof_root/tmp"
          cache_home="$proof_root/cache"
          corepack_home="$cache_home/corepack"
          pnpm_home="$proof_root/pnpm-home"
          safe_path="$pnpm_home:$PATH"
          env -i \
            HOME="$proof_home" \
            PATH="$safe_path" \
            CI=1 \
            TMPDIR="$proof_tmp" \
            XDG_CACHE_HOME="$cache_home" \
            COREPACK_HOME="$corepack_home" \
            PNPM_HOME="$pnpm_home" \
            PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false \
            pnpm_config_verify_deps_before_run=false \
            pnpm build
          test -f dist/media/document-extractors.worker.js

      - name: Prove Gateway PDF worker termination after client disconnect
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          node proof-tooling/.github/proof/pr-116337-pdf-worker-proof.mjs source

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-116337-pdf-worker-proof
          path: ${{ runner.temp }}/pr-116337-pdf-proof/evidence
          if-no-files-found: warn
          retention-days: 14
