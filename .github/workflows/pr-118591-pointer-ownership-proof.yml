name: PR 118591 pointer ownership proof

on:
  push:
    branches:
      - proof/pr-118591-e1b437e

permissions:
  contents: read

env:
  CANDIDATE_SHA: d2cc864d0e506a0993d61bf9f053bebc772d3258
  PRE_FIX_SHA: 42112dd86ec3010cb14011d7514c82063b12974a
  PROOF_DIR: .artifacts/control-ui-e2e/pr-118591-pointer-ownership

jobs:
  pre-fix-regressions:
    name: pre-fix focused regressions fail
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate tests
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact candidate
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$CANDIDATE_SHA" ]]; then
            echo "Expected $CANDIDATE_SHA, checked out $actual_sha" >&2
            exit 1
          fi

      - name: Setup candidate Node and pnpm environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
          cache-mode: restore

      - name: Restore pre-fix production files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 \
            https://github.com/openclaw/openclaw.git \
            "$PRE_FIX_SHA"
          git checkout "$PRE_FIX_SHA" -- \
            ui/src/components/resizable-divider.ts \
            ui/src/components/browser/browser-panel-controller-input.ts \
            ui/src/components/browser/browser-panel-controller.ts \
            ui/src/components/browser/browser-panel-render.ts \
            ui/src/components/browser/browser-panel.ts
          test "$(git rev-parse FETCH_HEAD)" = "$PRE_FIX_SHA"
          git diff --cached --name-only --diff-filter=M

      - name: Prove focused regressions fail before the fix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROOF_DIR/pre-fix"

          if node scripts/run-vitest.mjs \
            ui/src/components/resizable-divider.test.ts \
            -t "ends only the owner gesture when pointer capture is lost" \
            2>&1 | tee "$PROOF_DIR/pre-fix/resizable-divider.log"; then
            echo "Resizable-divider regression unexpectedly passed before the fix" >&2
            exit 1
          fi

          if node scripts/run-vitest.mjs \
            ui/src/components/browser/browser-panel-controller-annotation.test.ts \
            -t "keeps a stroke owned until its pointer ends or loses capture" \
            2>&1 | tee "$PROOF_DIR/pre-fix/browser-annotation-owner.log"; then
            echo "Annotation-owner regression unexpectedly passed before the fix" >&2
            exit 1
          fi

          if node scripts/run-vitest.mjs \
            ui/src/components/browser/browser-panel.test.ts \
            -t "ends an active annotation gesture" \
            2>&1 | tee "$PROOF_DIR/pre-fix/browser-panel-lifecycle.log"; then
            echo "Browser-panel lifecycle regression unexpectedly passed before the fix" >&2
            exit 1
          fi

      - name: Upload pre-fix failure output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-118591-pre-fix-regressions-d2cc864d0
          path: ${{ env.PROOF_DIR }}/pre-fix
          if-no-files-found: error
          retention-days: 30

  focused-tests:
    name: exact-head focused UI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact candidate
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$CANDIDATE_SHA" ]]; then
            echo "Expected $CANDIDATE_SHA, checked out $actual_sha" >&2
            exit 1
          fi

      - name: Setup candidate Node and pnpm environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
          cache-mode: restore

      - name: Run focused pointer ownership tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROOF_DIR"
          {
            node scripts/run-vitest.mjs \
              ui/src/components/resizable-divider.test.ts \
              ui/src/components/browser/browser-panel-controller-annotation.test.ts \
              ui/src/components/browser/browser-panel.test.ts
          } 2>&1 | tee "$PROOF_DIR/focused-tests.log"

      - name: Upload focused test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-118591-focused-tests-d2cc864d0
          path: ${{ env.PROOF_DIR }}/focused-tests.log
          if-no-files-found: error
          retention-days: 30

  chromium-proof:
    name: exact-head Chromium multi-pointer proof
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout isolated proof harness
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          path: .proof-harness
          fetch-depth: 1
          persist-credentials: false

      - name: Pin candidate and install temporary proof spec
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$CANDIDATE_SHA" ]]; then
            echo "Expected $CANDIDATE_SHA, checked out $actual_sha" >&2
            exit 1
          fi
          cp \
            .proof-harness/proof/pointer-ownership-proof.e2e.test.ts \
            ui/src/e2e/pointer-ownership-proof.e2e.test.ts
          printf 'candidate=%s\nharness=%s\n' "$actual_sha" "${GITHUB_SHA}"

      - name: Setup candidate Node and pnpm environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
          cache-mode: restore

      - name: Install candidate-pinned Chromium
        run: node --import tsx scripts/ensure-playwright-chromium.mts

      - name: Run visible multi-pointer proof
        env:
          CI: "1"
          OPENCLAW_POINTER_PROOF_DIR: ${{ env.PROOF_DIR }}
          OPENCLAW_UI_E2E_ALLOW_MISSING_CHROMIUM: "0"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROOF_DIR"
          node scripts/run-vitest.mjs run \
            --config test/vitest/vitest.ui-e2e.config.ts \
            --configLoader runner \
            ui/src/e2e/pointer-ownership-proof.e2e.test.ts \
            2>&1 | tee "$PROOF_DIR/test-output.log"

      - name: Hash proof artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$PROOF_DIR" ]]; then
            find "$PROOF_DIR" -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 -r sha256sum \
              > "$PROOF_DIR/SHA256SUMS.txt"
          fi

      - name: Publish proof summary
        if: always()
        shell: bash
        run: |
          {
            echo "## PR #118591 exact-head Chromium proof"
            echo
            echo "- Candidate: \`$CANDIDATE_SHA\`"
            echo "- Input: Chromium CDP touch-owner + mouse-foreign events"
            echo "- Scenario: shared divider ignores a foreign pointer, then clears ownership on close/reopen"
            echo "- Artifact: \`pr-118591-pointer-ownership-d2cc864d0\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots, recording, and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-118591-pointer-ownership-d2cc864d0
          path: ${{ env.PROOF_DIR }}
          if-no-files-found: error
          retention-days: 30

  upstream-browser-extension-retry:
    name: exact-head browser extension retry
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact candidate
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$CANDIDATE_SHA" ]]; then
            echo "Expected $CANDIDATE_SHA, checked out $actual_sha" >&2
            exit 1
          fi

      - name: Setup candidate Node and pnpm environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
          cache-mode: restore

      - name: Install exact CI Chromium
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/run-with-env.mts \
            PLAYWRIGHT_BROWSERS_PATH=.artifacts/playwright-browsers \
            -- node --import tsx scripts/ensure-playwright-chromium.mts \
            --require-playwright-chromium

      - name: Retry the unrelated upstream failure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROOF_DIR/upstream-retry"
          node --import tsx scripts/run-with-env.mts \
            PLAYWRIGHT_BROWSERS_PATH=.artifacts/playwright-browsers \
            OPENCLAW_BROWSER_EXTENSION_E2E=1 \
            OPENCLAW_E2E_WORKERS=1 \
            -- node scripts/run-vitest.mjs \
            extensions/browser/chrome-extension/bootstrap.chromium.test.ts \
            2>&1 | tee "$PROOF_DIR/upstream-retry/browser-extension.log"

      - name: Upload retry output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-118591-browser-extension-retry-d2cc864d0
          path: ${{ env.PROOF_DIR }}/upstream-retry
          if-no-files-found: error
          retention-days: 30
