name: PR 126566 focused lifecycle debug

on:
  push:
    branches:
      - ci/pr-126566-focused-debug-v5

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  focused-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout debug commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact PR source identity
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="969d08b5572bb7a23fd8439d2eff00b10cc72cdb"
          test "$(git rev-parse HEAD^)" = "$expected_sha"
          git diff --exit-code "$expected_sha" HEAD -- . \
            ':(exclude).github/workflows/pr-126566-isolated-debug.yml'

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.15.0"

      - name: Install exact-head dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          package_manager="$(node -p 'require("./package.json").packageManager')"
          corepack prepare "$package_manager" --activate
          pnpm install --frozen-lockfile

      - name: Run focused lifecycle owner proof
        run: |
          node scripts/run-vitest.mjs src/auto-reply/reply/agent-runner-execution-state.test.ts
          node scripts/run-vitest.mjs src/agents/embedded-agent-runner/run/deferred-lifecycle-owner.test.ts src/agents/embedded-agent-runner/run/attempt-trajectory-flush-cleanup.test.ts

      - name: Run shared auto-reply reply shard
        run: node scripts/run-vitest.mjs run --config test/vitest/vitest.auto-reply-reply.config.ts --configLoader runner
