name: PR 132668 lint-budget proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout immutable repaired head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: 49c5c21e4637a6e37144158c4be335efc97d0607
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "49c5c21e4637a6e37144158c4be335efc97d0607"

      - name: Setup Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack install
          pnpm install --frozen-lockfile

      - name: Verify formatter and lint budgets
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec oxfmt --check \
            src/cli/gateway-cli/pre-bootstrap.ts \
            src/cli/program/preaction.test.ts
          pnpm exec oxlint \
            src/cli/gateway-cli/pre-bootstrap.ts \
            src/cli/program/preaction.test.ts
