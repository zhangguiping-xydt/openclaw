name: PR 132668 git cancellation green proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout immutable candidate head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: 1be34067e3c2477a095992d9e1c50f453eafab85
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "1be34067e3c2477a095992d9e1c50f453eafab85"

      - name: Setup Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack install
          pnpm install --frozen-lockfile

      - name: Verify changed formatting and lint
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec oxfmt --check \
            src/plugins/git-install.ts \
            src/plugins/git-install.test.ts \
            src/plugins/git-install-target.test.ts
          pnpm exec oxlint \
            src/plugins/git-install.ts \
            src/plugins/git-install.test.ts \
            src/plugins/git-install-target.test.ts

      - name: Prove validation and both publication modes preserve the checkout
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs \
            src/plugins/git-install.test.ts \
            src/plugins/git-install-target.test.ts \
            --reporter=verbose \
            2>&1 | tee "$RUNNER_TEMP/pr-132668-git-cancel-green.log"
          grep -F "keeps the existing managed repo when cancellation arrives during package validation" \
            "$RUNNER_TEMP/pr-132668-git-cancel-green.log"
          grep -F "keeps the existing checkout when cancellation reaches" \
            "$RUNNER_TEMP/pr-132668-git-cancel-green.log"

      - name: Upload green regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pr-132668-git-cancellation-green
          path: ${{ runner.temp }}/pr-132668-git-cancel-green.log
          if-no-files-found: warn
          retention-days: 14
