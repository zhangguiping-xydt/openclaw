name: PR 132668 git cancellation red proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout immutable test-only head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: 6b1a24c61ed77ac258cea1b838d7869121fccd86
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "6b1a24c61ed77ac258cea1b838d7869121fccd86"

      - name: Setup Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack install
          pnpm install --frozen-lockfile

      - name: Verify changed test formatting
        shell: bash
        run: |
          pnpm exec oxfmt --check \
            src/plugins/git-install.test.ts \
            src/plugins/git-install-target.test.ts

      - name: Prove cancellation during validation still replaces the managed checkout
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/run-vitest.mjs \
            src/plugins/git-install.test.ts \
            src/plugins/git-install-target.test.ts \
            --reporter=verbose \
            2>&1 | tee "$RUNNER_TEMP/pr-132668-git-cancel-red.log"
          test_status="${PIPESTATUS[0]}"
          set -e
          test "$test_status" -ne 0
          grep -F "keeps the existing managed repo when cancellation arrives during package validation" \
            "$RUNNER_TEMP/pr-132668-git-cancel-red.log"
          grep -F "keeps the existing checkout when cancellation reaches" \
            "$RUNNER_TEMP/pr-132668-git-cancel-red.log"
          grep -F "instead of rejecting" "$RUNNER_TEMP/pr-132668-git-cancel-red.log"

      - name: Upload red regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pr-132668-git-cancellation-red
          path: ${{ runner.temp }}/pr-132668-git-cancel-red.log
          if-no-files-found: warn
          retention-days: 14
