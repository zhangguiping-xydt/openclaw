name: PR 132668 held-convergence proof

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact PR head to package and prove
        required: true
        default: 8c01de4b86177a0c97ef2c801b0cabe18f40ba30
        type: string

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable source identity
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          test "$actual_sha" = "8c01de4b86177a0c97ef2c801b0cabe18f40ba30"

      - name: Setup Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0

      - name: Enable the repository package manager
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack install
          pnpm --version

      - name: Restore exact-head package
        id: package_cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ runner.temp }}/package/openclaw-current.tgz
            ${{ runner.temp }}/package/codex-current.tgz
          key: pr-132668-package-v2-${{ inputs.source_sha }}

      - name: Install and package the exact head
        env:
          PACKAGE_CACHE_HIT: ${{ steps.package_cache.outputs.cache-hit }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/package"
          if test "$PACKAGE_CACHE_HIT" != "true"; then
            pnpm install --frozen-lockfile
            node scripts/package-openclaw-for-docker.mjs \
              --allow-unreleased-changelog \
              --output-dir "$RUNNER_TEMP/package" \
              --output-name openclaw-current.tgz
            node scripts/lib/plugin-npm-runtime-build.mjs extensions/codex
            node scripts/lib/plugin-npm-package-manifest.mjs --run extensions/codex -- \
              npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP/package"
            mapfile -t codex_archives < <(
              find "$RUNNER_TEMP/package" -maxdepth 1 -type f \
                -name 'openclaw-codex-*.tgz' -print
            )
            test "${#codex_archives[@]}" -eq 1
            mv "${codex_archives[0]}" "$RUNNER_TEMP/package/codex-current.tgz"
          fi
          test -s "$RUNNER_TEMP/package/openclaw-current.tgz"
          test -s "$RUNNER_TEMP/package/codex-current.tgz"
          tar -xOf "$RUNNER_TEMP/package/codex-current.tgz" package/package.json \
            | node -e '
                let input = "";
                process.stdin.on("data", (chunk) => { input += chunk; });
                process.stdin.on("end", () => {
                  const pkg = JSON.parse(input);
                  if (pkg.name !== "@openclaw/codex" || pkg.version !== "2026.8.1") {
                    throw new Error(`unexpected Codex artifact ${pkg.name}@${pkg.version}`);
                  }
                });
              '
          mkdir -p "$RUNNER_TEMP/package/codex-stale/package"
          tar -xzf "$RUNNER_TEMP/package/codex-current.tgz" \
            -C "$RUNNER_TEMP/package/codex-stale"
          node -e '
            const fs = require("node:fs");
            const manifestPath = process.argv[1];
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            manifest.version = "2026.1.1";
            fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          ' "$RUNNER_TEMP/package/codex-stale/package/package.json"
          tar -czf "$RUNNER_TEMP/package/codex-stale.tgz" \
            -C "$RUNNER_TEMP/package/codex-stale" package
          test -s "$RUNNER_TEMP/package/codex-stale.tgz"
          mkdir -p "$RUNNER_TEMP/openclaw-prefix"
          npm install --global --prefix "$RUNNER_TEMP/openclaw-prefix" \
            "$RUNNER_TEMP/package/openclaw-current.tgz"
          "$RUNNER_TEMP/openclaw-prefix/bin/openclaw" --version

      - name: Save exact-head package
        if: steps.package_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ runner.temp }}/package/openclaw-current.tgz
            ${{ runner.temp }}/package/codex-current.tgz
          key: pr-132668-package-v2-${{ inputs.source_sha }}

      - name: Interrupt held plugin convergence and start a replacement
        id: proof
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail

          proof_root="$RUNNER_TEMP/pr-132668-proof"
          proof_home="$proof_root/home"
          state_dir="$proof_root/state"
          config_path="$state_dir/openclaw.json"
          registry_port_file="$proof_root/registry-port"
          registry_backend_port_file="$proof_root/registry-backend-port"
          registry_request_file="$proof_root/registry-request"
          registry_hold_file="$proof_root/registry-hold"
          registry_log="$GITHUB_WORKSPACE/pr-132668-registry.log"
          registry_backend_log="$GITHUB_WORKSPACE/pr-132668-registry-backend.log"
          seed_install_log="$GITHUB_WORKSPACE/pr-132668-seed-install.log"
          gateway1_log="$GITHUB_WORKSPACE/pr-132668-gateway1.log"
          gateway2_log="$GITHUB_WORKSPACE/pr-132668-gateway2.log"
          gateway3_log="$GITHUB_WORKSPACE/pr-132668-gateway3.log"
          trace="$GITHUB_WORKSPACE/pr-132668-held-convergence-trace.txt"
          lease_db="$state_dir/state/openclaw.sqlite"
          gateway_port=19789
          openclaw_bin="$RUNNER_TEMP/openclaw-prefix/bin/openclaw"
          mkdir -p "$proof_home" "$state_dir"
          : >"$trace"
          printf 'head=%s\nnode=%s\n' "$EXPECTED_SHA" "$(node --version)" >>"$trace"

          cleanup() {
            if test -n "${gateway1_pid:-}" && kill -0 "$gateway1_pid" 2>/dev/null; then
              kill -KILL "$gateway1_pid" 2>/dev/null || true
            fi
            if test -n "${gateway2_pid:-}" && kill -0 "$gateway2_pid" 2>/dev/null; then
              kill -TERM "$gateway2_pid" 2>/dev/null || true
              sleep 1
              kill -KILL "$gateway2_pid" 2>/dev/null || true
            fi
            if test -n "${gateway3_pid:-}" && kill -0 "$gateway3_pid" 2>/dev/null; then
              kill -TERM "$gateway3_pid" 2>/dev/null || true
              sleep 1
              kill -KILL "$gateway3_pid" 2>/dev/null || true
            fi
            if test -n "${registry_pid:-}" && kill -0 "$registry_pid" 2>/dev/null; then
              kill -TERM "$registry_pid" 2>/dev/null || true
            fi
            if test -n "${registry_backend_pid:-}" && \
              kill -0 "$registry_backend_pid" 2>/dev/null; then
              kill -TERM "$registry_backend_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          cat >"$config_path" <<'JSON'
          {
            "gateway": {
              "mode": "local",
              "bind": "loopback",
              "auth": { "mode": "token", "token": "pr-132668-proof-only" }
            },
            "plugins": {
              "entries": { "codex": { "enabled": true } }
            }
          }
          JSON

          cat >"$proof_root/hold-registry.mjs" <<'NODE'
          import fs from "node:fs";
          import http from "node:http";

          const [portFile, requestFile, holdFile, logFile, upstreamRegistry] =
            process.argv.slice(2);
          const append = (line) => fs.appendFileSync(logFile, `${line}\n`);
          const sockets = new Set();
          const server = http.createServer((request, response) => {
            void handleRequest(request, response).catch((error) => {
              append(`proxy error ${String(error)}`);
              if (!response.headersSent) {
                response.writeHead(502, { "content-type": "text/plain" });
                response.end("registry proxy failed");
                return;
              }
              response.destroy(error instanceof Error ? error : new Error(String(error)));
            });
          });
          async function handleRequest(request, response) {
            append(`${request.method} ${request.url}`);
            const requestPath = request.url?.split("?", 1)[0] ?? "";
            let decodedPath = requestPath;
            try {
              decodedPath = decodeURIComponent(requestPath);
            } catch {}
            if (decodedPath === "/@openclaw/codex" && fs.existsSync(holdFile)) {
              fs.writeFileSync(requestFile, "GET /@openclaw%2Fcodex\n");
              request.once("close", () => append("held metadata request closed"));
              response.once("close", () => append("held metadata response closed"));
              return;
            }
            const upstreamUrl = new URL(request.url ?? "/", upstreamRegistry);
            const upstream = await fetch(upstreamUrl, {
              method: request.method,
              redirect: "manual",
              signal: AbortSignal.timeout(120_000),
            });
            const body = Buffer.from(await upstream.arrayBuffer());
            const headers = { "content-length": String(body.length) };
            for (const name of ["content-type", "location"]) {
              const value = upstream.headers.get(name);
              if (value) headers[name] = value;
            }
            append(`forwarded ${request.method} ${request.url} ${upstream.status}`);
            response.writeHead(upstream.status, headers);
            response.end(body);
          }
          server.on("connection", (socket) => {
            sockets.add(socket);
            socket.once("close", () => sockets.delete(socket));
          });
          server.listen(0, "127.0.0.1", () => {
            const address = server.address();
            if (!address || typeof address === "string") {
              throw new Error("registry did not bind a TCP port");
            }
            fs.writeFileSync(portFile, `${address.port}\n`);
          });
          process.once("SIGTERM", () => {
            for (const socket of sockets) socket.destroy();
            server.close(() => process.exit(0));
          });
          NODE

          env OPENCLAW_NPM_REGISTRY_UPSTREAM="https://registry.npmjs.org/" \
            node "$GITHUB_WORKSPACE/scripts/e2e/lib/plugins/npm-registry-server.mjs" \
              "$registry_backend_port_file" \
              "@openclaw/codex" "2026.1.1" \
              "$RUNNER_TEMP/package/codex-stale.tgz" \
              "@openclaw/codex" "2026.8.1" \
              "$RUNNER_TEMP/package/codex-current.tgz" \
              >"$registry_backend_log" 2>&1 &
          registry_backend_pid=$!
          for _ in $(seq 1 100); do
            test -s "$registry_backend_port_file" && break
            sleep 0.1
          done
          test -s "$registry_backend_port_file"
          registry_backend_port="$(tr -d '\r\n' <"$registry_backend_port_file")"
          registry_backend_url="http://127.0.0.1:$registry_backend_port/"

          node "$proof_root/hold-registry.mjs" \
            "$registry_port_file" "$registry_request_file" "$registry_hold_file" \
            "$registry_log" "$registry_backend_url" &
          registry_pid=$!
          for _ in $(seq 1 100); do
            test -s "$registry_port_file" && break
            sleep 0.1
          done
          test -s "$registry_port_file"
          registry_port="$(tr -d '\r\n' <"$registry_port_file")"
          registry_url="http://127.0.0.1:$registry_port/"

          env \
            HOME="$proof_home" \
            OPENCLAW_STATE_DIR="$state_dir" \
            OPENCLAW_CONFIG_PATH="$config_path" \
            NPM_CONFIG_REGISTRY="$registry_url" \
            npm_config_registry="$registry_url" \
            NPM_CONFIG_AUDIT=false \
            NPM_CONFIG_FUND=false \
            "$openclaw_bin" plugins install npm:@openclaw/codex@2026.1.1 \
              --force --accept-capabilities >"$seed_install_log" 2>&1
          installed_plugin_path="$(find "$state_dir" -type d \
            -path '*/node_modules/@openclaw/codex' -print -quit)"
          test -n "$installed_plugin_path"
          case "$installed_plugin_path" in
            "$state_dir"/*) ;;
            *) echo "installed plugin escaped the proof state root" >&2; exit 1 ;;
          esac
          test -f "$installed_plugin_path/package.json"
          seed_plugin_version="$(
            node -e 'process.stdout.write(require(process.argv[1]).version)' \
              "$installed_plugin_path/package.json"
          )"
          printf 'seed_plugin_version=%s\n' "$seed_plugin_version" >>"$trace"
          test "$seed_plugin_version" = "2026.1.1"

          rm -f "$registry_request_file"
          touch "$registry_hold_file"

          lease_count() {
            node --input-type=module - "$lease_db" <<'NODE'
          import { DatabaseSync } from "node:sqlite";
          const db = new DatabaseSync(process.argv[2], { readOnly: true });
          const row = db.prepare(
            "SELECT COUNT(*) AS count FROM state_leases WHERE scope = 'core:plugin-lifecycle' AND lease_key = 'global'",
          ).get();
          console.log(Number(row?.count ?? 0));
          db.close();
          NODE
          }

          collect_descendants() {
            local root_pid="$1"
            local known=" $root_pid "
            local changed=1
            while test "$changed" -eq 1; do
              changed=0
              while read -r child_pid parent_pid; do
                if [[ "$known" == *" $parent_pid "* ]] && [[ "$known" != *" $child_pid "* ]]; then
                  known+="$child_pid "
                  changed=1
                fi
              done < <(ps -e -o pid=,ppid=)
            done
            for pid in $known; do
              test "$pid" = "$root_pid" || printf '%s\n' "$pid"
            done
          }

          setsid env \
            HOME="$proof_home" \
            OPENCLAW_STATE_DIR="$state_dir" \
            OPENCLAW_CONFIG_PATH="$config_path" \
            NPM_CONFIG_REGISTRY="$registry_url" \
            npm_config_registry="$registry_url" \
            NPM_CONFIG_AUDIT=false \
            NPM_CONFIG_FUND=false \
            "$openclaw_bin" gateway run \
              --port "$gateway_port" --bind loopback --verbose \
              >"$gateway1_log" 2>&1 &
          gateway1_pid=$!
          gateway1_original_pid="$gateway1_pid"

          for _ in $(seq 1 1200); do
            if test -s "$registry_request_file" && test -f "$lease_db"; then
              current_lease_count="$(lease_count 2>/dev/null || true)"
              test "$current_lease_count" = "1" && break
            fi
            if ! kill -0 "$gateway1_pid" 2>/dev/null; then
              echo "Gateway 1 exited before the held convergence boundary" >&2
              sed -n '1,240p' "$gateway1_log" >&2
              exit 1
            fi
            sleep 0.25
          done
          test -s "$registry_request_file"
          lease_before_signal="$(lease_count)"
          printf 'lease_count_before_signal=%s\n' "$lease_before_signal" >>"$trace"
          test "$lease_before_signal" = "1"

          ready_before="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-time 2 "http://127.0.0.1:$gateway_port/readyz" || true)"
          printf 'ready_http_before_signal=%s\n' "$ready_before" >>"$trace"
          test "$ready_before" = "000"
          collect_descendants "$gateway1_pid" >"$proof_root/gateway1-descendants"
          pstree -ap "$gateway1_pid" >"$proof_root/gateway1-tree-before.txt" || true

          kill -TERM "$gateway1_pid"
          set +e
          wait "$gateway1_pid"
          gateway1_exit_code=$?
          set -e
          gateway1_pid=""
          printf 'gateway1_exit_code=%s\n' "$gateway1_exit_code" >>"$trace"
          test "$gateway1_exit_code" -eq 143

          for _ in $(seq 1 200); do
            test "$(lease_count 2>/dev/null || true)" = "0" && break
            sleep 0.1
          done
          lease_after_exit="$(lease_count)"
          printf 'lease_count_after_exit=%s\n' "$lease_after_exit" >>"$trace"
          test "$lease_after_exit" = "0"

          surviving_descendants=0
          while read -r child_pid; do
            if test -n "$child_pid" && kill -0 "$child_pid" 2>/dev/null; then
              surviving_descendants=$((surviving_descendants + 1))
            fi
          done <"$proof_root/gateway1-descendants"
          printf 'surviving_gateway1_descendants=%s\n' "$surviving_descendants" >>"$trace"
          test "$surviving_descendants" -eq 0

          rm -f "$registry_hold_file"

          setsid env \
            HOME="$proof_home" \
            OPENCLAW_STATE_DIR="$state_dir" \
            OPENCLAW_CONFIG_PATH="$config_path" \
            NPM_CONFIG_REGISTRY="$registry_url" \
            npm_config_registry="$registry_url" \
            NPM_CONFIG_AUDIT=false \
            NPM_CONFIG_FUND=false \
            "$openclaw_bin" gateway run \
              --port "$gateway_port" --bind loopback --verbose \
              >"$gateway2_log" 2>&1 &
          gateway2_pid=$!
          gateway2_original_pid="$gateway2_pid"
          test "$gateway2_pid" -ne "$gateway1_original_pid"

          gateway2_ready_http=000
          gateway2_restart_required=false
          for _ in $(seq 1 1200); do
            gateway2_ready_http="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 2 "http://127.0.0.1:$gateway_port/readyz" || true)"
            if test "$gateway2_ready_http" = "200"; then
              echo "Gateway 2 unexpectedly reported ready before the migration restart" >&2
              exit 1
            fi
            if ! kill -0 "$gateway2_pid" 2>/dev/null; then
              set +e
              wait "$gateway2_pid"
              gateway2_exit_code=$?
              set -e
              gateway2_pid=""
              gateway2_restart_required=true
              break
            fi
            sleep 0.25
          done
          printf 'gateway2_ready_http=%s\ngateway2_exit_code=%s\n' \
            "$gateway2_ready_http" "${gateway2_exit_code:-still-running}" >>"$trace"
          test "$gateway2_restart_required" = "true"
          grep -Fq \
            "OpenClaw plugin migration inputs changed during startup convergence; refusing to report the gateway ready." \
            "$gateway2_log"
          replacement_plugin_path="$(find "$state_dir" -type d \
            -path '*/node_modules/@openclaw/codex' -print -quit)"
          test -n "$replacement_plugin_path"
          case "$replacement_plugin_path" in
            "$state_dir"/*) ;;
            *) echo "replacement plugin escaped the proof state root" >&2; exit 1 ;;
          esac
          replacement_plugin_version="$(
            node -e 'process.stdout.write(require(process.argv[1]).version)' \
              "$replacement_plugin_path/package.json"
          )"
          printf 'replacement_plugin_version=%s\n' \
            "$replacement_plugin_version" >>"$trace"
          test "$replacement_plugin_version" = "2026.8.1"

          for _ in $(seq 1 200); do
            test "$(lease_count 2>/dev/null || true)" = "0" && break
            sleep 0.1
          done
          lease_after_convergence_restart="$(lease_count)"
          printf 'lease_count_after_convergence_restart=%s\n' \
            "$lease_after_convergence_restart" >>"$trace"
          test "$lease_after_convergence_restart" = "0"

          setsid env \
            HOME="$proof_home" \
            OPENCLAW_STATE_DIR="$state_dir" \
            OPENCLAW_CONFIG_PATH="$config_path" \
            NPM_CONFIG_REGISTRY="$registry_url" \
            npm_config_registry="$registry_url" \
            NPM_CONFIG_AUDIT=false \
            NPM_CONFIG_FUND=false \
            "$openclaw_bin" gateway run \
              --port "$gateway_port" --bind loopback --verbose \
              >"$gateway3_log" 2>&1 &
          gateway3_pid=$!
          test "$gateway3_pid" -ne "$gateway1_original_pid"
          test "$gateway3_pid" -ne "$gateway2_original_pid"

          gateway3_ready_http=000
          for _ in $(seq 1 1200); do
            gateway3_ready_http="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 2 "http://127.0.0.1:$gateway_port/readyz" || true)"
            test "$gateway3_ready_http" = "200" && break
            if ! kill -0 "$gateway3_pid" 2>/dev/null; then
              echo "Final replacement Gateway exited before readiness" >&2
              sed -n '1,300p' "$gateway3_log" >&2
              exit 1
            fi
            sleep 0.25
          done
          printf 'gateway3_ready_http=%s\n' "$gateway3_ready_http" >>"$trace"
          test "$gateway3_ready_http" = "200"
          kill -0 "$gateway3_pid"
          printf 'gateway3_running_after_ready=true\n' >>"$trace"
          registry_request="$(tr -d '\r\n' <"$registry_request_file")"

          {
            echo "head=$EXPECTED_SHA"
            echo "node=$(node --version)"
            echo "gateway1_phase=plugin-convergence"
            echo "registry_request=$registry_request"
            echo "lease_count_before_signal=1"
            echo "ready_http_before_signal=$ready_before"
            echo "gateway1_signal=SIGTERM"
            echo "gateway1_exit_code=$gateway1_exit_code"
            echo "npm_process_tree_after_exit=none"
            echo "lease_count_after_exit=$lease_after_exit"
            echo "lease_count_before_replacement=$lease_after_exit"
            echo "gateway2_pid_differs=true"
            echo "gateway2_role=completed-plugin-convergence"
            echo "gateway2_ready_http_before_restart=$gateway2_ready_http"
            echo "gateway2_restart_required=true"
            echo "gateway2_exit_code=$gateway2_exit_code"
            echo "replacement_plugin=@openclaw/codex@$replacement_plugin_version"
            echo "lease_count_after_convergence_restart=$lease_after_convergence_restart"
            echo "gateway3_pid_differs=true"
            echo "gateway3_role=final-replacement"
            echo "gateway3_ready_http=$gateway3_ready_http"
            echo "gateway3_ready=true"
            echo "gateway3_running_after_ready=true"
            echo "same_state_and_port=true"
          } | tee "$trace"

      - name: Upload redacted proof logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-132668-held-convergence-proof
          path: |
            pr-132668-held-convergence-trace.txt
            pr-132668-registry.log
            pr-132668-registry-backend.log
            pr-132668-seed-install.log
            pr-132668-gateway1.log
            pr-132668-gateway2.log
            pr-132668-gateway3.log
          if-no-files-found: warn
          retention-days: 14
