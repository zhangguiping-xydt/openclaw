name: PR 132668 pre-bootstrap cancellation green proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout immutable repaired head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: 9afc89cebf69ce867b32583d5274acfc40b11a78
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "9afc89cebf69ce867b32583d5274acfc40b11a78"

      - name: Fetch the changed-gate baseline
        shell: bash
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      - name: Setup Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack install
          pnpm install --frozen-lockfile

      - name: Prove both Gateway entry paths cancel pre-bootstrap recovery
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs \
            src/cli/run-main.exit.test.ts \
            src/cli/program/preaction.test.ts \
            src/cli/gateway-cli/run.option-collisions.test.ts \
            src/config/io.observe-recovery.test.ts \
            --reporter=verbose \
            2>&1 | tee "$RUNNER_TEMP/pr-132668-green.log"
          grep -F "stops suspicious config recovery when Gateway startup is interrupted" \
            "$RUNNER_TEMP/pr-132668-green.log"
          grep -F "passes CLI options and the startup signal to Gateway pre-bootstrap" \
            "$RUNNER_TEMP/pr-132668-green.log"

      - name: Verify changed source and test formatting
        shell: bash
        run: |
          pnpm exec oxfmt --check \
            src/cli/gateway-cli/pre-bootstrap.ts \
            src/cli/program/preaction.test.ts \
            src/cli/program/preaction.ts \
            src/cli/run-main.exit.test.ts \
            src/cli/run-main.ts
          pnpm exec oxlint \
            src/cli/gateway-cli/pre-bootstrap.ts \
            src/cli/program/preaction.test.ts

      - name: Upload green regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pr-132668-pre-bootstrap-cancellation-green
          path: ${{ runner.temp }}/pr-132668-green.log
          if-no-files-found: warn
          retention-days: 14
