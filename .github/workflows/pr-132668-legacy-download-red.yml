name: PR 132668 pre-bootstrap cancellation red proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout immutable pre-fix test head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: 502362fb134f00e169001dfa3c07582a4e523fa6
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "502362fb134f00e169001dfa3c07582a4e523fa6"

      - name: Setup Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack install
          pnpm install --frozen-lockfile

      - name: Prove pre-bootstrap recovery remains authorized after SIGTERM
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/run-vitest.mjs src/cli/run-main.exit.test.ts --reporter=verbose \
            2>&1 | tee "$RUNNER_TEMP/pr-132668-red.log"
          test_status="${PIPESTATUS[0]}"
          set -e
          test "$test_status" -ne 0
          grep -F "stops suspicious config recovery when Gateway startup is interrupted" \
            "$RUNNER_TEMP/pr-132668-red.log"
          grep -F "expected true to be false" \
            "$RUNNER_TEMP/pr-132668-red.log"

      - name: Verify changed test formatting
        shell: bash
        run: pnpm exec oxfmt --check src/cli/run-main.exit.test.ts

      - name: Upload red regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pr-132668-pre-bootstrap-cancellation-red
          path: ${{ runner.temp }}/pr-132668-red.log
          if-no-files-found: warn
          retention-days: 14
