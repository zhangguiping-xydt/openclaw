name: PR 132668 metadata-abort regression

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact fork commit to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable source identity
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack install
          pnpm install --frozen-lockfile

      - name: Run metadata-abort convergence regression
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: >-
          node scripts/run-vitest.mjs
          src/cli/update-cli/post-core-plugin-convergence.test.ts
