name: PR 132703 Firecrawl SecretRef proof

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact contributor head to build and prove
        required: true
        default: d4da5d01f5b8b6da75281153a8018146889c2422
        type: string

permissions:
  contents: read

concurrency:
  group: pr-132703-firecrawl-secretref-proof
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout trusted proof tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: proof-tooling
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: Clone exact contributor head anonymously
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_SHA" = "d4da5d01f5b8b6da75281153a8018146889c2422"
          git init source
          git -C source remote add origin https://github.com/zhangguiping-xydt/openclaw.git
          git -C source fetch --depth=1 origin verify/pr-132703-d4da5d0
          git -C source checkout --detach FETCH_HEAD
          actual_sha="$(git -C source rev-parse HEAD)"
          echo "Validation SHA: $actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Install pinned dependencies without inherited credentials
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/pr-132703-firecrawl-proof"
          proof_home="$proof_root/home"
          proof_tmp="$proof_root/tmp"
          cache_home="$proof_root/cache"
          corepack_home="$cache_home/corepack"
          pnpm_home="$proof_root/pnpm-home"
          mkdir -p "$proof_home" "$proof_tmp" "$cache_home" "$corepack_home" "$pnpm_home"
          safe_path="$pnpm_home:$PATH"
          expected_package_manager="pnpm@12.1.0+sha512.d9b8276d97f6ec86e49815877f91ee9f63cee61f2063b304e43b6dab8fa07ce8a9afd46d2facd39f921e6a9d06b3c75a81349c7b888c2d22886bae0229901037"
          package_manager="$(
            env -i \
              HOME="$proof_home" \
              PATH="$safe_path" \
              CI=1 \
              TMPDIR="$proof_tmp" \
              XDG_CACHE_HOME="$cache_home" \
              node -e 'const p=require("./package.json"); process.stdout.write(p.packageManager || "")'
          )"
          test "$package_manager" = "$expected_package_manager"
          env -i \
            HOME="$proof_home" \
            PATH="$safe_path" \
            CI=1 \
            TMPDIR="$proof_tmp" \
            XDG_CACHE_HOME="$cache_home" \
            COREPACK_HOME="$corepack_home" \
            PNPM_HOME="$pnpm_home" \
            corepack enable --install-directory "$pnpm_home"
          env -i \
            HOME="$proof_home" \
            PATH="$safe_path" \
            CI=1 \
            TMPDIR="$proof_tmp" \
            XDG_CACHE_HOME="$cache_home" \
            COREPACK_HOME="$corepack_home" \
            PNPM_HOME="$pnpm_home" \
            corepack prepare "$package_manager" --activate
          env -i \
            HOME="$proof_home" \
            PATH="$safe_path" \
            CI=1 \
            TMPDIR="$proof_tmp" \
            XDG_CACHE_HOME="$cache_home" \
            COREPACK_HOME="$corepack_home" \
            PNPM_HOME="$pnpm_home" \
            PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false \
            pnpm_config_verify_deps_before_run=false \
            pnpm install --frozen-lockfile --prefer-offline

      - name: Verify focused test and exact lint failure surface
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/pr-132703-firecrawl-proof"
          safe_path="$proof_root/pnpm-home:$PATH"
          env -i \
            HOME="$proof_root/home" \
            PATH="$safe_path" \
            CI=1 \
            TMPDIR="$proof_root/tmp" \
            XDG_CACHE_HOME="$proof_root/cache" \
            COREPACK_HOME="$proof_root/cache/corepack" \
            PNPM_HOME="$proof_root/pnpm-home" \
            PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false \
            pnpm_config_verify_deps_before_run=false \
            node scripts/run-vitest.mjs extensions/firecrawl/src/firecrawl-tools.test.ts
          env -i \
            HOME="$proof_root/home" \
            PATH="$safe_path" \
            CI=1 \
            TMPDIR="$proof_root/tmp" \
            XDG_CACHE_HOME="$proof_root/cache" \
            COREPACK_HOME="$proof_root/cache/corepack" \
            PNPM_HOME="$proof_root/pnpm-home" \
            PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false \
            pnpm_config_verify_deps_before_run=false \
            node --import tsx scripts/run-oxlint-shards.mts --only=extensions --threads=1
          env -i \
            HOME="$proof_root/home" \
            PATH="$safe_path" \
            CI=1 \
            TMPDIR="$proof_root/tmp" \
            XDG_CACHE_HOME="$proof_root/cache" \
            COREPACK_HOME="$proof_root/cache/corepack" \
            PNPM_HOME="$proof_root/pnpm-home" \
            PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false \
            pnpm_config_verify_deps_before_run=false \
            pnpm format:check

      - name: Build exact head
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/pr-132703-firecrawl-proof"
          safe_path="$proof_root/pnpm-home:$PATH"
          env -i \
            HOME="$proof_root/home" \
            PATH="$safe_path" \
            CI=1 \
            TMPDIR="$proof_root/tmp" \
            XDG_CACHE_HOME="$proof_root/cache" \
            COREPACK_HOME="$proof_root/cache/corepack" \
            PNPM_HOME="$proof_root/pnpm-home" \
            PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false \
            pnpm_config_verify_deps_before_run=false \
            pnpm build

      - name: Prove file SecretRef routing through built Gateway
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/pr-132703-firecrawl-proof"
          safe_path="$proof_root/pnpm-home:$PATH"
          env -i \
            HOME="$proof_root/home" \
            PATH="$safe_path" \
            CI=1 \
            TMPDIR="$proof_root/tmp" \
            XDG_CACHE_HOME="$proof_root/cache" \
            EXPECTED_SHA="$EXPECTED_SHA" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            node proof-tooling/.github/proof/pr-132703-firecrawl-secretref-proof.mjs source

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-132703-firecrawl-secretref-proof
          path: ${{ runner.temp }}/pr-132703-firecrawl-proof/evidence
          if-no-files-found: warn
          retention-days: 14
