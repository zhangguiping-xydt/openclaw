name: PR 132704 timeout recovery proof

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact contributor head to verify
        required: true
        default: 9dacd35cb2128c7248d1cdcd5871c4c48f66a659
        type: string
      before_sha:
        description: Parent head expected to fail the new delivery regression
        required: true
        default: 74f2e74750dfa251e22d2b0510c6445a45b90013
        type: string

permissions:
  contents: read

concurrency:
  group: pr-132704-timeout-recovery-proof
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout trusted proof tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: proof-tooling
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: Clone exact contributor head anonymously
        env:
          EXPECTED_SHA: ${{ inputs.target_sha }}
          BEFORE_SHA: ${{ inputs.before_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_SHA" = "9dacd35cb2128c7248d1cdcd5871c4c48f66a659"
          test "$BEFORE_SHA" = "74f2e74750dfa251e22d2b0510c6445a45b90013"
          git init source
          git -C source remote add origin https://github.com/zhangguiping-xydt/openclaw.git
          git -C source fetch --depth=8 origin verify/pr-132704-9dacd35
          git -C source fetch --depth=1 origin "$BEFORE_SHA"
          git -C source checkout --detach "$EXPECTED_SHA"
          actual_sha="$(git -C source rev-parse HEAD)"
          echo "Validation SHA: $actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"
          git -C source cat-file -e "$BEFORE_SHA^{commit}"

      - name: Install pinned dependencies without inherited credentials
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/pr-132704-timeout-recovery-proof"
          proof_home="$proof_root/home"
          proof_tmp="$proof_root/tmp"
          cache_home="$proof_root/cache"
          corepack_home="$cache_home/corepack"
          pnpm_home="$proof_root/pnpm-home"
          mkdir -p "$proof_home" "$proof_tmp" "$cache_home" "$corepack_home" "$pnpm_home"
          safe_path="$pnpm_home:$PATH"
          expected_package_manager="pnpm@12.1.0+sha512.d9b8276d97f6ec86e49815877f91ee9f63cee61f2063b304e43b6dab8fa07ce8a9afd46d2facd39f921e6a9d06b3c75a81349c7b888c2d22886bae0229901037"
          package_manager="$(
            env -i HOME="$proof_home" PATH="$safe_path" CI=1 TMPDIR="$proof_tmp" \
              XDG_CACHE_HOME="$cache_home" \
              node -e 'const p=require("./package.json"); process.stdout.write(p.packageManager || "")'
          )"
          test "$package_manager" = "$expected_package_manager"
          env -i HOME="$proof_home" PATH="$safe_path" CI=1 TMPDIR="$proof_tmp" \
            XDG_CACHE_HOME="$cache_home" COREPACK_HOME="$corepack_home" PNPM_HOME="$pnpm_home" \
            corepack enable --install-directory "$pnpm_home"
          env -i HOME="$proof_home" PATH="$safe_path" CI=1 TMPDIR="$proof_tmp" \
            XDG_CACHE_HOME="$cache_home" COREPACK_HOME="$corepack_home" PNPM_HOME="$pnpm_home" \
            corepack prepare "$package_manager" --activate
          env -i HOME="$proof_home" PATH="$safe_path" CI=1 TMPDIR="$proof_tmp" \
            XDG_CACHE_HOME="$cache_home" COREPACK_HOME="$corepack_home" PNPM_HOME="$pnpm_home" \
            PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false pnpm_config_verify_deps_before_run=false \
            pnpm install --frozen-lockfile --prefer-offline

      - name: Verify focused regressions and formatting
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/pr-132704-timeout-recovery-proof"
          evidence="$proof_root/evidence"
          safe_path="$proof_root/pnpm-home:$PATH"
          mkdir -p "$evidence"
          env -i HOME="$proof_root/home" PATH="$safe_path" CI=1 TMPDIR="$proof_root/tmp" \
            XDG_CACHE_HOME="$proof_root/cache" COREPACK_HOME="$proof_root/cache/corepack" \
            PNPM_HOME="$proof_root/pnpm-home" PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false \
            pnpm_config_verify_deps_before_run=false \
            node scripts/run-vitest.mjs \
              src/agents/embedded-agent-runner/runs.lifecycle.test.ts \
              src/agents/embedded-agent-runner/run.timeout-context-recovery.test.ts \
              src/agents/embedded-agent-runner/run.timeout-recovery-delivery.test.ts \
              src/agents/embedded-agent-runner/run.shared-integration.test.ts \
              src/agents/subagents/announce/subagent-announce-delivery.test.ts \
            2>&1 | tee "$evidence/focused-tests.log"
          env -i HOME="$proof_root/home" PATH="$safe_path" CI=1 TMPDIR="$proof_root/tmp" \
            XDG_CACHE_HOME="$proof_root/cache" COREPACK_HOME="$proof_root/cache/corepack" \
            PNPM_HOME="$proof_root/pnpm-home" PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false \
            pnpm_config_verify_deps_before_run=false pnpm format:check \
            2>&1 | tee "$evidence/format-check.log"

      - name: Prove regression fails before the fence
        env:
          EXPECTED_SHA: ${{ inputs.target_sha }}
          BEFORE_SHA: ${{ inputs.before_sha }}
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/pr-132704-timeout-recovery-proof"
          evidence="$proof_root/evidence"
          safe_path="$proof_root/pnpm-home:$PATH"
          test_file="src/agents/embedded-agent-runner/run.timeout-recovery-delivery.test.ts"
          cp "$test_file" "$proof_root/pre-fix-regression.test.ts"
          git checkout --detach "$BEFORE_SHA"
          cp "$proof_root/pre-fix-regression.test.ts" "$test_file"
          set +e
          env -i HOME="$proof_root/home" PATH="$safe_path" CI=1 TMPDIR="$proof_root/tmp" \
            XDG_CACHE_HOME="$proof_root/cache" COREPACK_HOME="$proof_root/cache/corepack" \
            PNPM_HOME="$proof_root/pnpm-home" PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false \
            pnpm_config_verify_deps_before_run=false \
            node scripts/run-vitest.mjs "$test_file" >"$evidence/pre-fix-regression.log" 2>&1
          pre_fix_status=$?
          set -e
          test "$pre_fix_status" -ne 0
          grep -q "completion_handoff_pending" "$evidence/pre-fix-regression.log"
          rm "$test_file"
          git checkout --detach "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          PRE_FIX_STATUS="$pre_fix_status" BEFORE_SHA="$BEFORE_SHA" EXPECTED_SHA="$EXPECTED_SHA" \
            node -e '
              const fs = require("node:fs");
              const path = require("node:path");
              const out = {
                beforeSha: process.env.BEFORE_SHA,
                exactHead: process.env.EXPECTED_SHA,
                regressionFailedBeforeFix: Number(process.env.PRE_FIX_STATUS) !== 0,
              };
              fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "pr-132704-timeout-recovery-proof", "evidence", "pre-fix-verdict.json"), JSON.stringify(out, null, 2) + "\n");
            '

      - name: Generate production-boundary trace
        env:
          EXPECTED_SHA: ${{ inputs.target_sha }}
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/pr-132704-timeout-recovery-proof"
          safe_path="$proof_root/pnpm-home:$PATH"
          env -i HOME="$proof_root/home" PATH="$safe_path" CI=1 NODE_ENV=test \
            TMPDIR="$proof_root/tmp" XDG_CACHE_HOME="$proof_root/cache" \
            EXPECTED_SHA="$EXPECTED_SHA" EVIDENCE_DIR="$proof_root/evidence" \
            node --import tsx \
              ../proof-tooling/.github/proof/pr-132704-timeout-recovery-proof.mts .

      - name: Build exact head
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/pr-132704-timeout-recovery-proof"
          safe_path="$proof_root/pnpm-home:$PATH"
          env -i HOME="$proof_root/home" PATH="$safe_path" CI=1 TMPDIR="$proof_root/tmp" \
            XDG_CACHE_HOME="$proof_root/cache" COREPACK_HOME="$proof_root/cache/corepack" \
            PNPM_HOME="$proof_root/pnpm-home" PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false \
            pnpm_config_verify_deps_before_run=false pnpm build

      - name: Seal proof evidence
        if: always()
        env:
          EXPECTED_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pr-132704-timeout-recovery-proof/evidence"
          if [ -d "$evidence" ]; then
            TOOLING_SHA="$(git -C proof-tooling rev-parse HEAD)" EXPECTED_SHA="$EXPECTED_SHA" \
              node -e '
                const fs = require("node:fs");
                const path = require("node:path");
                const evidence = path.join(process.env.RUNNER_TEMP, "pr-132704-timeout-recovery-proof", "evidence");
                fs.writeFileSync(path.join(evidence, "manifest.json"), JSON.stringify({
                  exactHead: process.env.EXPECTED_SHA,
                  toolingSha: process.env.TOOLING_SHA,
                  workflowRunId: process.env.GITHUB_RUN_ID,
                }, null, 2) + "\n");
              '
            (cd "$evidence" && sha256sum *.json *.log > manifest.sha256)
          fi

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-132704-timeout-recovery-9dacd35-${{ github.run_id }}
          path: ${{ runner.temp }}/pr-132704-timeout-recovery-proof/evidence
          if-no-files-found: warn
          retention-days: 14
