name: PR 132723 Slack receipt proof

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact contributor head to verify
        required: true
        default: 598e4d8005c32becfe04c61c6bc4d5731eb65b5b
        type: string
      expected_result:
        description: Expected focused-test result
        required: true
        default: red
        type: choice
        options:
          - red
          - green

permissions:
  contents: read

concurrency:
  group: pr-132723-slack-receipt-proof
  cancel-in-progress: false

jobs:
  focused-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout trusted proof tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: proof-tooling
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: Clone exact contributor head anonymously
        env:
          EXPECTED_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_SHA" = "598e4d8005c32becfe04c61c6bc4d5731eb65b5b"
          git init source
          git -C source remote add origin https://github.com/zhangguiping-xydt/openclaw.git
          git -C source fetch --depth=1 origin "$EXPECTED_SHA"
          git -C source checkout --detach "$EXPECTED_SHA"
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install pinned dependencies without inherited credentials
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/pr-132723-slack-receipt-proof"
          mkdir -p "$proof_root/home" "$proof_root/tmp" "$proof_root/cache/corepack" "$proof_root/pnpm-home" "$proof_root/evidence"
          safe_path="$proof_root/pnpm-home:$PATH"
          package_manager="$(env -i HOME="$proof_root/home" PATH="$safe_path" CI=1 node -e 'const p=require("./package.json"); process.stdout.write(p.packageManager || "")')"
          test "$package_manager" = "pnpm@12.1.0+sha512.d9b8276d97f6ec86e49815877f91ee9f63cee61f2063b304e43b6dab8fa07ce8a9afd46d2facd39f921e6a9d06b3c75a81349c7b888c2d22886bae0229901037"
          env -i HOME="$proof_root/home" PATH="$safe_path" CI=1 COREPACK_HOME="$proof_root/cache/corepack" PNPM_HOME="$proof_root/pnpm-home" corepack enable --install-directory "$proof_root/pnpm-home"
          env -i HOME="$proof_root/home" PATH="$safe_path" CI=1 COREPACK_HOME="$proof_root/cache/corepack" PNPM_HOME="$proof_root/pnpm-home" corepack prepare "$package_manager" --activate
          env -i HOME="$proof_root/home" PATH="$safe_path" CI=1 TMPDIR="$proof_root/tmp" XDG_CACHE_HOME="$proof_root/cache" COREPACK_HOME="$proof_root/cache/corepack" PNPM_HOME="$proof_root/pnpm-home" PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false pnpm_config_verify_deps_before_run=false pnpm install --frozen-lockfile --prefer-offline

      - name: Run focused restart-replay regression
        env:
          EXPECTED_RESULT: ${{ inputs.expected_result }}
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/pr-132723-slack-receipt-proof"
          evidence="$proof_root/evidence"
          safe_path="$proof_root/pnpm-home:$PATH"
          set +e
          env -i HOME="$proof_root/home" PATH="$safe_path" CI=1 TMPDIR="$proof_root/tmp" XDG_CACHE_HOME="$proof_root/cache" COREPACK_HOME="$proof_root/cache/corepack" PNPM_HOME="$proof_root/pnpm-home" PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false pnpm_config_verify_deps_before_run=false node scripts/run-vitest.mjs extensions/slack/src/monitor/message-handler.test.ts >"$evidence/focused-test.log" 2>&1
          test_status=$?
          set -e
          cat "$evidence/focused-test.log"
          if [ "$EXPECTED_RESULT" = "red" ]; then
            test "$test_status" -ne 0
            grep -q "records one operator receipt when a dropped logical message replays after restart" "$evidence/focused-test.log"
            grep -Eq "called (once|1 time)|toHaveBeenCalledExactlyOnceWith" "$evidence/focused-test.log"
          else
            test "$test_status" -eq 0
          fi
          TEST_STATUS="$test_status" EXPECTED_RESULT="$EXPECTED_RESULT" node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "pr-132723-slack-receipt-proof", "evidence", "focused-verdict.json"), JSON.stringify({ exactHead: process.env.GITHUB_SHA, expectedResult: process.env.EXPECTED_RESULT, testStatus: Number(process.env.TEST_STATUS) }, null, 2) + "\n");
          '

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-132723-slack-receipt-focused-${{ github.run_id }}
          path: ${{ runner.temp }}/pr-132723-slack-receipt-proof/evidence
          if-no-files-found: warn
          retention-days: 14
