name: PR 132723 Slack receipt proof

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact contributor head to verify
        required: true
        default: c7fc9b675382401a3e98f3e4c1682f7cf33fcb80
        type: string

permissions:
  contents: read

concurrency:
  group: pr-132723-slack-receipt-proof
  cancel-in-progress: false

jobs:
  focused-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout trusted proof tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: proof-tooling
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: Clone exact contributor head anonymously
        env:
          EXPECTED_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_SHA" = "c7fc9b675382401a3e98f3e4c1682f7cf33fcb80"
          git init source
          git -C source remote add origin https://github.com/zhangguiping-xydt/openclaw.git
          git -C source fetch --depth=1 origin "$EXPECTED_SHA"
          git -C source checkout --detach "$EXPECTED_SHA"
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install pinned dependencies without inherited credentials
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/pr-132723-slack-receipt-proof"
          mkdir -p "$proof_root/home" "$proof_root/tmp" "$proof_root/cache/corepack" "$proof_root/pnpm-home" "$proof_root/evidence"
          safe_path="$proof_root/pnpm-home:$PATH"
          package_manager="$(env -i HOME="$proof_root/home" PATH="$safe_path" CI=1 node -e 'const p=require("./package.json"); process.stdout.write(p.packageManager || "")')"
          test "$package_manager" = "pnpm@12.1.0+sha512.d9b8276d97f6ec86e49815877f91ee9f63cee61f2063b304e43b6dab8fa07ce8a9afd46d2facd39f921e6a9d06b3c75a81349c7b888c2d22886bae0229901037"
          env -i HOME="$proof_root/home" PATH="$safe_path" CI=1 COREPACK_HOME="$proof_root/cache/corepack" PNPM_HOME="$proof_root/pnpm-home" corepack enable --install-directory "$proof_root/pnpm-home"
          env -i HOME="$proof_root/home" PATH="$safe_path" CI=1 COREPACK_HOME="$proof_root/cache/corepack" PNPM_HOME="$proof_root/pnpm-home" corepack prepare "$package_manager" --activate
          env -i HOME="$proof_root/home" PATH="$safe_path" CI=1 TMPDIR="$proof_root/tmp" XDG_CACHE_HOME="$proof_root/cache" COREPACK_HOME="$proof_root/cache/corepack" PNPM_HOME="$proof_root/pnpm-home" PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false pnpm_config_verify_deps_before_run=false pnpm install --frozen-lockfile --prefer-offline

      - name: Run focused preparation and dispatch regressions
        env:
          EXPECTED_SHA: ${{ inputs.target_sha }}
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/pr-132723-slack-receipt-proof"
          evidence="$proof_root/evidence"
          safe_path="$proof_root/pnpm-home:$PATH"
          env -i HOME="$proof_root/home" PATH="$safe_path" CI=1 TMPDIR="$proof_root/tmp" XDG_CACHE_HOME="$proof_root/cache" COREPACK_HOME="$proof_root/cache/corepack" PNPM_HOME="$proof_root/pnpm-home" PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false pnpm_config_verify_deps_before_run=false node scripts/run-vitest.mjs extensions/slack/src/monitor/message-handler/prepare.test.ts extensions/slack/src/monitor/message-handler.test.ts >"$evidence/focused-test.log" 2>&1
          cat "$evidence/focused-test.log"
          grep -q "records a bounded receipt when message preparation has no content" extensions/slack/src/monitor/message-handler/prepare.test.ts
          grep -q "allows app_mention retry" extensions/slack/src/monitor/message-handler/prepare.test.ts
          EXPECTED_SHA="$EXPECTED_SHA" node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "pr-132723-slack-receipt-proof", "evidence", "focused-verdict.json"), JSON.stringify({ schema: "openclaw.pr132723.focused-regression.v2", exactHead: process.env.EXPECTED_SHA, expectedResult: "green", testStatus: 0, files: ["extensions/slack/src/monitor/message-handler/prepare.test.ts", "extensions/slack/src/monitor/message-handler.test.ts"] }, null, 2) + "\n");
          '

      - name: Hash focused evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pr-132723-slack-receipt-proof/evidence"
          if [ -d "$evidence" ]; then
            (cd "$evidence" && sha256sum focused-test.log focused-verdict.json > SHA256SUMS)
          fi

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-132723-slack-receipt-focused-${{ github.run_id }}
          path: ${{ runner.temp }}/pr-132723-slack-receipt-proof/evidence
          if-no-files-found: warn
          retention-days: 14

  pre-fix-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: Clone pre-fix source and overlay the exact-head regression
        env:
          EXACT_HEAD_SHA: ${{ inputs.target_sha }}
          PRE_FIX_SHA: 00b64b81c4073e594c423bcb5e7a5ca1c5a6f6d7
        shell: bash
        run: |
          set -euo pipefail
          test "$EXACT_HEAD_SHA" = "c7fc9b675382401a3e98f3e4c1682f7cf33fcb80"
          git init source
          git -C source remote add upstream https://github.com/openclaw/openclaw.git
          git -C source fetch --depth=1 upstream "$PRE_FIX_SHA"
          git -C source checkout --detach "$PRE_FIX_SHA"
          test "$(git -C source rev-parse HEAD)" = "$PRE_FIX_SHA"
          git init exact-head
          git -C exact-head remote add origin https://github.com/zhangguiping-xydt/openclaw.git
          git -C exact-head fetch --depth=1 origin "$EXACT_HEAD_SHA"
          git -C exact-head checkout --detach "$EXACT_HEAD_SHA"
          test "$(git -C exact-head rev-parse HEAD)" = "$EXACT_HEAD_SHA"
          cp exact-head/extensions/slack/src/monitor/message-handler/prepare.test.ts source/extensions/slack/src/monitor/message-handler/prepare.test.ts

      - name: Install pinned dependencies without inherited credentials
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/pr-132723-slack-pre-fix-proof"
          mkdir -p "$proof_root/home" "$proof_root/tmp" "$proof_root/cache/corepack" "$proof_root/pnpm-home" "$proof_root/evidence"
          safe_path="$proof_root/pnpm-home:$PATH"
          package_manager="$(env -i HOME="$proof_root/home" PATH="$safe_path" CI=1 node -e 'const p=require("./package.json"); process.stdout.write(p.packageManager || "")')"
          test "$package_manager" = "pnpm@12.1.0+sha512.d9b8276d97f6ec86e49815877f91ee9f63cee61f2063b304e43b6dab8fa07ce8a9afd46d2facd39f921e6a9d06b3c75a81349c7b888c2d22886bae0229901037"
          env -i HOME="$proof_root/home" PATH="$safe_path" CI=1 COREPACK_HOME="$proof_root/cache/corepack" PNPM_HOME="$proof_root/pnpm-home" corepack enable --install-directory "$proof_root/pnpm-home"
          env -i HOME="$proof_root/home" PATH="$safe_path" CI=1 COREPACK_HOME="$proof_root/cache/corepack" PNPM_HOME="$proof_root/pnpm-home" corepack prepare "$package_manager" --activate
          env -i HOME="$proof_root/home" PATH="$safe_path" CI=1 TMPDIR="$proof_root/tmp" XDG_CACHE_HOME="$proof_root/cache" COREPACK_HOME="$proof_root/cache/corepack" PNPM_HOME="$proof_root/pnpm-home" PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false pnpm_config_verify_deps_before_run=false pnpm install --frozen-lockfile --prefer-offline

      - name: Prove the regression fails before the fix
        env:
          EXACT_HEAD_SHA: ${{ inputs.target_sha }}
          PRE_FIX_SHA: 00b64b81c4073e594c423bcb5e7a5ca1c5a6f6d7
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/pr-132723-slack-pre-fix-proof"
          evidence="$proof_root/evidence"
          safe_path="$proof_root/pnpm-home:$PATH"
          set +e
          env -i HOME="$proof_root/home" PATH="$safe_path" CI=1 TMPDIR="$proof_root/tmp" XDG_CACHE_HOME="$proof_root/cache" COREPACK_HOME="$proof_root/cache/corepack" PNPM_HOME="$proof_root/pnpm-home" PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false pnpm_config_verify_deps_before_run=false node scripts/run-vitest.mjs extensions/slack/src/monitor/message-handler/prepare.test.ts >"$evidence/pre-fix-test.log" 2>&1
          test_status=$?
          set -e
          cat "$evidence/pre-fix-test.log"
          test "$test_status" -ne 0
          grep -q "records a bounded receipt when message preparation has no content" "$evidence/pre-fix-test.log"
          grep -q "allows app_mention retry" "$evidence/pre-fix-test.log"
          grep -Eq "AssertionError|expected .*spy.*called|toHaveBeenCalledExactlyOnceWith" "$evidence/pre-fix-test.log"
          TEST_STATUS="$test_status" EXACT_HEAD_SHA="$EXACT_HEAD_SHA" PRE_FIX_SHA="$PRE_FIX_SHA" node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "pr-132723-slack-pre-fix-proof", "evidence", "pre-fix-verdict.json"), JSON.stringify({ schema: "openclaw.pr132723.pre-fix-regression.v1", preFixHead: process.env.PRE_FIX_SHA, regressionFromHead: process.env.EXACT_HEAD_SHA, expectedResult: "red", testStatus: Number(process.env.TEST_STATUS), intendedReceiptAssertionsObserved: true }, null, 2) + "\n");
          '

      - name: Hash pre-fix evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pr-132723-slack-pre-fix-proof/evidence"
          if [ -d "$evidence" ]; then
            (cd "$evidence" && sha256sum pre-fix-test.log pre-fix-verdict.json > SHA256SUMS)
          fi

      - name: Upload pre-fix red evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-132723-slack-receipt-pre-fix-red-${{ github.run_id }}
          path: ${{ runner.temp }}/pr-132723-slack-pre-fix-proof/evidence
          if-no-files-found: warn
          retention-days: 14

  gateway-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout trusted proof tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: proof-tooling
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: Clone exact contributor head anonymously
        env:
          EXPECTED_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_SHA" = "c7fc9b675382401a3e98f3e4c1682f7cf33fcb80"
          git init source
          git -C source remote add origin https://github.com/zhangguiping-xydt/openclaw.git
          git -C source fetch --depth=1 origin "$EXPECTED_SHA"
          git -C source checkout --detach "$EXPECTED_SHA"
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install pinned dependencies without inherited credentials
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/pr-132723-slack-gateway-proof"
          mkdir -p "$proof_root/home" "$proof_root/tmp" "$proof_root/cache/corepack" "$proof_root/pnpm-home" "$proof_root/evidence"
          safe_path="$proof_root/pnpm-home:$PATH"
          package_manager="$(env -i HOME="$proof_root/home" PATH="$safe_path" CI=1 node -e 'const p=require("./package.json"); process.stdout.write(p.packageManager || "")')"
          test "$package_manager" = "pnpm@12.1.0+sha512.d9b8276d97f6ec86e49815877f91ee9f63cee61f2063b304e43b6dab8fa07ce8a9afd46d2facd39f921e6a9d06b3c75a81349c7b888c2d22886bae0229901037"
          env -i HOME="$proof_root/home" PATH="$safe_path" CI=1 COREPACK_HOME="$proof_root/cache/corepack" PNPM_HOME="$proof_root/pnpm-home" corepack enable --install-directory "$proof_root/pnpm-home"
          env -i HOME="$proof_root/home" PATH="$safe_path" CI=1 COREPACK_HOME="$proof_root/cache/corepack" PNPM_HOME="$proof_root/pnpm-home" corepack prepare "$package_manager" --activate
          env -i HOME="$proof_root/home" PATH="$safe_path" CI=1 TMPDIR="$proof_root/tmp" XDG_CACHE_HOME="$proof_root/cache" COREPACK_HOME="$proof_root/cache/corepack" PNPM_HOME="$proof_root/pnpm-home" PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false pnpm_config_verify_deps_before_run=false pnpm install --frozen-lockfile --prefer-offline

      - name: Build exact contributor head
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/pr-132723-slack-gateway-proof"
          safe_path="$proof_root/pnpm-home:$PATH"
          env -i HOME="$proof_root/home" PATH="$safe_path" CI=1 TMPDIR="$proof_root/tmp" XDG_CACHE_HOME="$proof_root/cache" COREPACK_HOME="$proof_root/cache/corepack" PNPM_HOME="$proof_root/pnpm-home" PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false pnpm_config_verify_deps_before_run=false pnpm build

      - name: Run secretless mock Slack API and real Gateway restart proof
        env:
          EXPECTED_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/pr-132723-slack-gateway-proof"
          safe_path="$proof_root/pnpm-home:$PATH"
          env -i HOME="$proof_root/home" PATH="$safe_path" CI=1 RUNNER_TEMP="$RUNNER_TEMP" TMPDIR="$proof_root/tmp" EXPECTED_SHA="$EXPECTED_SHA" EVIDENCE_DIR="$proof_root/evidence" node proof-tooling/.github/proof/pr-132723-slack-receipt-gateway.mjs source

      - name: Hash Gateway proof evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pr-132723-slack-gateway-proof/evidence"
          if [ -f "$evidence/gateway-verdict.json" ]; then
            (cd "$evidence" && sha256sum gateway-verdict.json > SHA256SUMS)
          fi

      - name: Upload Gateway proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-132723-slack-receipt-gateway-${{ github.run_id }}
          path: ${{ runner.temp }}/pr-132723-slack-gateway-proof/evidence
          if-no-files-found: warn
          retention-days: 14
