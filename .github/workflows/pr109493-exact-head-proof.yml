name: PR 109493 exact-head worker quiescence proof

on:
  push:
    branches:
      - proof/pr109493-bf9f96d-20260730

permissions:
  contents: read

jobs:
  proof:
    name: Exact-head worker quiescence runtime proof
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout proof tools
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          path: proof-tools

      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: zhangguiping-xydt/openclaw
          ref: bf9f96dae93b703331b08431f555bee969a029fa
          persist-credentials: false
          path: pr

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0

      - name: Run exact production-script proof
        env:
          OPENCLAW_PROOF_REPO_ROOT: ${{ github.workspace }}/pr
        run: |
          set -euo pipefail
          cd "$OPENCLAW_PROOF_REPO_ROOT"
          node "$GITHUB_WORKSPACE/proof-tools/.github/proof/pr109493-worker-quiescence-proof.mjs" \
            | tee "$GITHUB_WORKSPACE/pr109493-worker-quiescence-proof.txt"

      - name: Upload redacted transcript
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr109493-worker-quiescence-proof
          path: pr109493-worker-quiescence-proof.txt
          if-no-files-found: warn
          retention-days: 7
