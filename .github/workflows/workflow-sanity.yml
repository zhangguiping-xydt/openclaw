name: Workflow Sanity

on:
  pull_request:
    paths-ignore:
      - "CHANGELOG.md"
  push:
    branches: [main, proof/pr-111702-runtime-20260720]
    paths-ignore:
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  pr-111702-board-runtime-proof:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/proof/pr-111702-runtime-20260720'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR head without credentials
        env:
          EXPECTED_HEAD_SHA: ad93d79abbe39dcb97de875691622e5ae6cabc30
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config gc.auto 0
          git -C "$GITHUB_WORKSPACE" remote add origin https://github.com/openclaw/openclaw.git
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "+refs/pull/111702/head:refs/remotes/origin/proof-head"
          git -C "$GITHUB_WORKSPACE" checkout --detach refs/remotes/origin/proof-head
          actual_head_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$actual_head_sha" = "$EXPECTED_HEAD_SHA"
          echo "PROOF_HEAD_SHA=$actual_head_sha"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.x"

      - name: Install exact dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm install --frozen-lockfile

      - name: Run live Gateway board.event proof
        env:
          EXPECTED_HEAD_SHA: ad93d79abbe39dcb97de875691622e5ae6cabc30
          OPENCLAW_STATE_DIR: ${{ runner.temp }}/openclaw-pr111702-state
        run: |
          set -euo pipefail
          gateway_port=19071
          gateway_token=proof-local-token
          gateway_url="ws://127.0.0.1:${gateway_port}"
          gateway_log="$RUNNER_TEMP/openclaw-pr111702-gateway.log"
          mkdir -p "$OPENCLAW_STATE_DIR"

          pnpm openclaw gateway run \
            --allow-unconfigured \
            --bind loopback \
            --port "$gateway_port" \
            --auth token \
            --token "$gateway_token" \
            >"$gateway_log" 2>&1 &
          gateway_pid=$!
          cleanup() {
            kill "$gateway_pid" 2>/dev/null || true
            wait "$gateway_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if pnpm openclaw gateway call health \
              --url "$gateway_url" \
              --token "$gateway_token" \
              --json >"$RUNNER_TEMP/health.json" 2>/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$gateway_pid" 2>/dev/null; then
              sed -n '1,240p' "$gateway_log"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            sed -n '1,240p' "$gateway_log"
            exit 1
          fi

          pnpm openclaw gateway call sessions.create \
            --url "$gateway_url" \
            --token "$gateway_token" \
            --json \
            --params '{"key":"agent:main:main","agentId":"main"}' \
            >"$RUNNER_TEMP/session-create.json"

          pnpm openclaw gateway call board.widget.put \
            --url "$gateway_url" \
            --token "$gateway_token" \
            --json \
            --params '{"sessionKey":"agent:main:main","name":"counter","content":{"kind":"html","html":"ok"}}' \
            >"$RUNNER_TEMP/widget-put.json"

          board_event_params="$(node -e '
            const prefix = "[dashboard] ";
            const suffix = " on widget counter";
            const clippedCodeUnits = 500 - prefix.length - suffix.length - 1;
            process.stdout.write(JSON.stringify({
              sessionKey: "agent:main:main",
              widget: "counter",
              payload: `${"x".repeat(clippedCodeUnits - 2)}😀tail`,
            }));
          ')"
          pnpm openclaw gateway call board.event \
            --url "$gateway_url" \
            --token "$gateway_token" \
            --json \
            --params "$board_event_params" \
            >"$RUNNER_TEMP/board-event.json"

          pnpm openclaw gateway call status \
            --url "$gateway_url" \
            --token "$gateway_token" \
            --json \
            --params '{"includeChannelSummary":false}' \
            >"$RUNNER_TEMP/status.json"

          node - "$RUNNER_TEMP/board-event.json" "$RUNNER_TEMP/status.json" "$GITHUB_STEP_SUMMARY" <<'NODE'
          const fs = require("node:fs");
          const [eventPath, statusPath, summaryPath] = process.argv.slice(2);
          const eventRpc = JSON.parse(fs.readFileSync(eventPath, "utf8"));
          const status = JSON.parse(fs.readFileSync(statusPath, "utf8"));
          const notice = status.queuedSystemEvents?.[0];
          if (eventRpc?.ok !== true || eventRpc?.appended !== true) {
            throw new Error(`board.event RPC did not append: ${JSON.stringify(eventRpc)}`);
          }
          if (typeof notice !== "string") {
            throw new Error(`status returned no queued board notice: ${JSON.stringify(status.queuedSystemEvents)}`);
          }
          let hasUnpairedSurrogate = false;
          for (let index = 0; index < notice.length; index += 1) {
            const current = notice.charCodeAt(index);
            if (current >= 0xd800 && current <= 0xdbff) {
              const next = notice.charCodeAt(index + 1);
              if (!(next >= 0xdc00 && next <= 0xdfff)) {
                hasUnpairedSurrogate = true;
                break;
              }
              index += 1;
            } else if (current >= 0xdc00 && current <= 0xdfff) {
              hasUnpairedSurrogate = true;
              break;
            }
          }
          const endsWithSuffix = notice.endsWith("… on widget counter");
          const hasReplacementCharacter = notice.includes("�");
          const proof = {
            headSha: process.env.EXPECTED_HEAD_SHA,
            boardEventRpc: eventRpc,
            noticeUtf16CodeUnits: notice.length,
            hasUnpairedSurrogate,
            hasReplacementCharacter,
            endsWithSuffix,
            notice,
          };
          console.log(`PROOF_HEAD_SHA=${proof.headSha}`);
          console.log(`BOARD_EVENT_RPC=${JSON.stringify(proof.boardEventRpc)}`);
          console.log(`NOTICE_UTF16_CODE_UNITS=${proof.noticeUtf16CodeUnits}`);
          console.log(`NOTICE_HAS_UNPAIRED_SURROGATE=${proof.hasUnpairedSurrogate}`);
          console.log(`NOTICE_HAS_REPLACEMENT_CHARACTER=${proof.hasReplacementCharacter}`);
          console.log(`NOTICE_ENDS_WITH_EXPECTED_SUFFIX=${proof.endsWithSuffix}`);
          console.log(`NOTICE_JSON=${JSON.stringify(proof.notice)}`);
          fs.appendFileSync(
            summaryPath,
            [
              "## PR #111702 live Gateway proof",
              "",
              `- Exact head: \`${proof.headSha}\``,
              `- \`board.event\` response: \`${JSON.stringify(proof.boardEventRpc)}\``,
              `- Notice UTF-16 code units: \`${proof.noticeUtf16CodeUnits}\``,
              `- Unpaired surrogate: \`${proof.hasUnpairedSurrogate}\``,
              `- Replacement character: \`${proof.hasReplacementCharacter}\``,
              `- Expected suffix: \`${proof.endsWithSuffix}\``,
              `- Emitted notice: \`${JSON.stringify(proof.notice)}\``,
              "",
            ].join("\n"),
          );
          if (
            proof.noticeUtf16CodeUnits > 500 ||
            proof.hasUnpairedSurrogate ||
            proof.hasReplacementCharacter ||
            !proof.endsWithSuffix
          ) {
            process.exit(1);
          }
          NODE

  no-tabs:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - &workflow_sanity_checkout_step
        name: Checkout
        env:
          CHECKOUT_REPO: ${{ github.repository }}
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config gc.auto 0
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${CHECKOUT_REPO}.git"
          fetch_checkout_ref() {
            local fetch_status
            for attempt in 1 2 3; do
              timeout --signal=TERM --kill-after=10s 30s git -C "$GITHUB_WORKSPACE" \
                -c protocol.version=2 \
                fetch --no-tags --prune --no-recurse-submodules --depth=1 origin \
                "+${CHECKOUT_SHA}:refs/remotes/origin/checkout" && return 0
              fetch_status="$?"
              if [ "$fetch_status" != "124" ] && [ "$fetch_status" != "137" ]; then
                return "$fetch_status"
              fi
              if [ "$attempt" = "3" ]; then
                return "$fetch_status"
              fi
              echo "::warning::checkout fetch for '$CHECKOUT_SHA' timed out on attempt $attempt; retrying"
              sleep 5
            done
          }
          fetch_checkout_ref
          git -C "$GITHUB_WORKSPACE" checkout --detach refs/remotes/origin/checkout

      - name: Fail on tabs in workflow files
        run: |
          python - <<'PY'
          from __future__ import annotations

          import pathlib
          import sys

          root = pathlib.Path(".github/workflows")
          bad: list[str] = []
          for path in sorted(root.rglob("*.yml")):
            if b"\t" in path.read_bytes():
              bad.append(str(path))

          for path in sorted(root.rglob("*.yaml")):
            if b"\t" in path.read_bytes():
              bad.append(str(path))

          if bad:
            print("Tabs found in workflow file(s):")
            for path in bad:
              print(f"- {path}")
            sys.exit(1)
          PY

  actionlint:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - *workflow_sanity_checkout_step
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Prepare trusted workflow audit configs
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          trusted_config="$RUNNER_TEMP/pre-commit-base.yaml"
          trusted_zizmor_config="$RUNNER_TEMP/zizmor-base.yml"

          fetch_base_ref() {
            local ref="$1"
            local target="$2"
            local fetch_status
            for attempt in 1 2 3; do
              timeout --signal=TERM --kill-after=10s 30s git fetch --no-tags --depth=1 origin \
                "+${ref}:${target}" && return 0
              fetch_status="$?"
              if [ "$fetch_status" != "124" ] && [ "$fetch_status" != "137" ]; then
                return "$fetch_status"
              fi
              if [ "$attempt" = "3" ]; then
                return "$fetch_status"
              fi
              echo "::warning::trusted base fetch for '$ref' timed out on attempt $attempt; retrying"
              sleep 5
            done
          }

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            fetch_base_ref "$BASE_SHA" "refs/remotes/origin/security-base" ||
              fetch_base_ref "refs/heads/${BASE_REF}" "refs/remotes/origin/${BASE_REF}"
          fi

          if git cat-file -e "${BASE_SHA}:.pre-commit-config.yaml" 2>/dev/null; then
            git show "${BASE_SHA}:.pre-commit-config.yaml" > "$trusted_config"
          elif git show "refs/remotes/origin/${BASE_REF}:.pre-commit-config.yaml" \
            > "$trusted_config" 2>/dev/null; then
            echo "Base SHA ${BASE_SHA} does not expose .pre-commit-config.yaml; using origin/${BASE_REF} instead."
          else
            echo "::error title=trusted pre-commit config unavailable::Could not read .pre-commit-config.yaml from ${BASE_SHA} or origin/${BASE_REF}."
            exit 1
          fi

          if git cat-file -e "${BASE_SHA}:.github/zizmor.yml" 2>/dev/null; then
            git show "${BASE_SHA}:.github/zizmor.yml" > "$trusted_zizmor_config"
          elif git show "refs/remotes/origin/${BASE_REF}:.github/zizmor.yml" \
            > "$trusted_zizmor_config" 2>/dev/null; then
            echo "Base SHA ${BASE_SHA} does not expose .github/zizmor.yml; using origin/${BASE_REF} instead."
          else
            echo "::error title=trusted zizmor config unavailable::Could not read .github/zizmor.yml from ${BASE_SHA} or origin/${BASE_REF}."
            exit 1
          fi

          python3 - "$trusted_config" "$trusted_zizmor_config" <<'PY'
          from pathlib import Path
          import sys

          config_path = Path(sys.argv[1])
          zizmor_config_path = sys.argv[2]
          text = config_path.read_text()
          if ".github/zizmor.yml" not in text:
            raise SystemExit("trusted pre-commit config does not reference .github/zizmor.yml")
          config_path.write_text(text.replace(".github/zizmor.yml", zizmor_config_path))
          PY

          echo "PRE_COMMIT_CONFIG_PATH=$trusted_config" >> "$GITHUB_ENV"

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit==4.2.0

      - name: Install ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          SHELLCHECK_VERSION="0.11.0"
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl --connect-timeout 10 --max-time 120 \
            --retry 5 --retry-delay 2 --retry-all-errors -sSfL \
            -o "${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  ${archive}" | sha256sum -c -
          tar -xJf "${archive}" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          sudo install -m 0755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION="1.7.11"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          # GitHub release downloads occasionally return transient 5xx responses.
          # Retry all curl errors here so workflow-sanity does not fail closed on
          # a one-off release edge outage.
          curl_args=(
            --connect-timeout 10
            --max-time 120
            --retry 5
            --retry-delay 2
            --retry-all-errors
            -sSfL
          )
          curl "${curl_args[@]}" -o "${archive}" "${base_url}/${archive}"
          curl "${curl_args[@]}" -o checksums.txt "${base_url}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "${archive}" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      - name: Lint workflows
        run: actionlint

      - name: Audit all workflows with zizmor
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t workflow_files < <(
            find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort
          )
          pre-commit run --config "${PRE_COMMIT_CONFIG_PATH:-.pre-commit-config.yaml}" zizmor --files "${workflow_files[@]}"

      - name: Disallow direct inputs interpolation in composite run blocks
        run: python3 scripts/check-composite-action-input-interpolation.py

      - name: Disallow tracked merge conflict markers
        run: node scripts/check-no-conflict-markers.mjs

  generated-doc-baselines:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - *workflow_sanity_checkout_step
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Check config docs drift statefile
        run: pnpm config:docs:check

      - name: Check plugin SDK API contract manifest
        run: pnpm plugin-sdk:api:check

      - name: Check SQLite sessions/transcripts schema baseline drift
        run: pnpm sqlite:sessions-schema:check

      - name: Check plugin SDK surface budget
        run: pnpm plugin-sdk:surface:check
